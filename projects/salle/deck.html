<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>SALLE — The Operating System & Intelligence Layer for Hospitality</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A0A0D; --surface:#15151B; --surface2:#1d1d25;
  --bone:#F4F1EA; --mute:#8A8A93;
  --amber:#C8912A; --amber-lit:#E9B949; --green:#37C281; --red:#E5564B;
  --edge:rgba(244,241,234,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink); color:var(--bone);
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
  letter-spacing:-0.01em;
}
body[data-lang="zh"]{font-family:"Noto Sans TC","Inter",system-ui,sans-serif;letter-spacing:0}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}

/* progress */
#prog{position:fixed;top:0;left:0;height:2px;background:var(--amber);width:0;z-index:50;transition:width .35s ease}

/* lang switch */
#lang{position:fixed;top:18px;right:22px;z-index:60;display:flex;gap:4px;
  background:rgba(21,21,27,.7);backdrop-filter:blur(10px);border:1px solid var(--edge);border-radius:999px;padding:4px}
#lang button{font:inherit;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--mute);
  background:transparent;border:0;border-radius:999px;padding:6px 12px;cursor:pointer;transition:.18s}
#lang button:hover{color:var(--bone)}
#lang button.on{background:var(--amber);color:#000}

/* deck */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:7vh 8vw}
.slide{max-width:1080px;width:100%;opacity:0;transform:translateY(10px);
  transition:opacity .4s ease,transform .4s ease;display:none}
.slide.show{display:block;opacity:1;transform:none}
.kicker{font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin-bottom:26px}
.kicker .n{color:var(--amber)}
h1.t{font-weight:700;line-height:1.04;letter-spacing:-.03em;font-size:clamp(34px,5.6vw,84px)}
.sub{color:var(--mute);font-size:clamp(18px,2vw,30px);font-weight:500;line-height:1.3;margin-top:22px;max-width:24ch}
.body{margin-top:30px;font-size:clamp(16px,1.5vw,21px);line-height:1.6;color:var(--bone);max-width:60ch}
.body p{margin:.5em 0;color:var(--mute)}
.body strong{color:var(--bone);font-weight:600}
.am{color:var(--amber)}
.foot{margin-top:26px;font-size:12px;color:var(--mute);font-family:"JetBrains Mono",monospace}

/* center variants */
.slide.center{text-align:center}
.slide.center .sub,.slide.center .body{margin-left:auto;margin-right:auto}
.slide.center h1.t{font-size:clamp(36px,6vw,92px)}

/* cover */
.wordmark{font-weight:800;letter-spacing:-.04em;font-size:clamp(56px,12vw,160px);line-height:1}
.uline{height:2px;width:120px;background:var(--amber);margin:30px auto 0;border-radius:2px}

/* stat stack */
.stats{margin-top:34px;display:flex;flex-direction:column;gap:18px}
.stat{display:flex;align-items:baseline;gap:18px}
.stat .v{font-weight:800;font-size:clamp(36px,5vw,68px);line-height:1;letter-spacing:-.03em}
.stat .v.am{color:var(--amber)} .stat .v.red{color:var(--red)}
.stat .l{color:var(--mute);font-size:clamp(14px,1.4vw,19px)}

/* generic list rows */
.rows{margin-top:30px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:16px;align-items:flex-start;font-size:clamp(15px,1.45vw,20px)}
.row .lead{color:var(--amber);font-weight:700;min-width:148px}
.row .txt{color:var(--mute)} .row .txt b{color:var(--bone);font-weight:600}

/* cards grid (orphan tools) */
.grid{margin-top:30px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--surface);border:1px solid var(--edge);border-radius:12px;padding:18px 14px;text-align:center;
  font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--mute);letter-spacing:.04em}
.disc{margin-top:18px;color:var(--red);font-size:14px;font-family:"JetBrains Mono",monospace}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}

/* architecture */
.arch{margin-top:30px;display:flex;flex-direction:column;gap:10px;align-items:center}
.ablock{background:var(--surface);border:1px solid var(--edge);border-radius:12px;padding:14px 18px;text-align:center;width:100%}
.ablock .h{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.ablock .d{font-size:13px;color:var(--bone);margin-top:4px}
.ablock.glow{border-color:var(--amber);box-shadow:0 0 32px rgba(200,145,42,.18)}
.ablock.glow .h{color:var(--amber)}
.arow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.arow .ablock{padding:12px 8px}
.aconn{color:var(--mute);font-size:18px;line-height:1}
@media(max-width:720px){.arow{grid-template-columns:repeat(2,1fr)}}

/* flywheel — static, upright labels */
.fly{margin:26px auto 0;position:relative;width:min(380px,60vw);aspect-ratio:1}
.fly .ring{position:absolute;inset:8%;border:1px dashed var(--edge);border-radius:50%}
.fly .arrow{position:absolute;inset:8%;border-radius:50%;border:2px solid transparent;border-top-color:var(--amber);border-right-color:var(--amber);transform:rotate(20deg);opacity:.6}
.fly .core{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.14em;color:var(--amber);text-align:center;text-transform:uppercase;line-height:1.5}
.node{position:absolute;transform:translate(-50%,-50%);background:var(--surface);border:1px solid var(--edge);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--bone);white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.node .st{font-family:"JetBrains Mono",monospace;color:var(--amber);margin-right:6px}
.n0{top:0;left:50%}.n1{top:34%;left:97%}.n2{top:90%;left:78%}.n3{top:90%;left:22%}.n4{top:34%;left:3%}
.flycap{text-align:center;color:var(--mute);margin-top:24px;font-size:15px}
@media(max-width:760px){.node{font-size:11px;padding:6px 10px}}

/* matrix 2x2 */
.mx{margin-top:22px;position:relative;height:min(360px,44vh);border-left:1px solid var(--edge);border-bottom:1px solid var(--edge)}
.mx .qgrid{position:absolute;inset:0;background:
  linear-gradient(to right,transparent 49.6%,var(--edge) 49.6%,var(--edge) 50.4%,transparent 50.4%),
  linear-gradient(to bottom,transparent 49.6%,var(--edge) 49.6%,var(--edge) 50.4%,transparent 50.4%);opacity:.4}
.mx .axl{position:absolute;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.mx .axl.ytop{top:6px;left:8px;color:var(--amber)}
.mx .axl.ybot{top:56%;left:8px}
.mx .axl.left{left:8px;bottom:8px}
.mx .axl.right{right:6px;bottom:8px}
.dot{position:absolute;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mute);transform:translate(-50%,-50%);white-space:nowrap}
.dot::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--mute);flex-shrink:0}
.dot.us{color:var(--amber);font-weight:700;font-size:16px}.dot.us::before{background:var(--amber);box-shadow:0 0 16px var(--amber)}
.mxnote{margin-top:30px;color:var(--mute);font-size:13px;line-height:1.5}
.mxnote b{color:var(--bone)}

/* table */
table.cmp{margin-top:24px;width:100%;border-collapse:collapse;font-size:14px}
table.cmp th,table.cmp td{padding:11px 10px;text-align:center;border-bottom:1px solid var(--edge)}
table.cmp th{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:500}
table.cmp td:first-child,table.cmp th:first-child{text-align:left;color:var(--bone)}
table.cmp .yes{color:var(--green)} table.cmp .no{color:var(--mute);opacity:.5} table.cmp .mid{color:var(--mute)}
table.cmp tr.us td{background:rgba(200,145,42,.07);color:var(--bone);font-weight:600}
table.cmp tr.us .yes{color:var(--amber)}

/* tam rings */
.tam{margin-top:26px;display:flex;flex-direction:column;gap:0;align-items:flex-start}
.ring{border:1px solid var(--edge);border-radius:14px;padding:16px 18px;width:100%;margin-bottom:-1px}
.ring.s2{width:80%} .ring.s3{width:56%;border-color:var(--amber);box-shadow:0 0 28px rgba(200,145,42,.15)}
.ring .lab{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.ring.s3 .lab{color:var(--amber)}
.ring .v{font-weight:700;font-size:clamp(18px,2.2vw,26px);margin-top:2px}
.ring .d{color:var(--mute);font-size:13px;margin-top:2px}

/* ladder */
.ladder{margin-top:30px;display:flex;align-items:flex-end;gap:10px;height:200px}
.lstep{flex:1;background:linear-gradient(180deg,var(--amber-lit),var(--amber));border-radius:10px 10px 0 0;
  display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#000;font-weight:600;font-size:12px;opacity:.55}
.lstep:nth-child(2){opacity:.7}.lstep:nth-child(3){opacity:.85}.lstep:nth-child(4){opacity:1}
.lstep .h{font-size:10px;font-family:"JetBrains Mono",monospace}

/* moats */
.moats{margin-top:28px;display:flex;flex-direction:column;gap:10px}
.moat{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--edge);border-left:3px solid var(--amber);border-radius:10px;padding:13px 16px}
.moat .num{font-family:"JetBrains Mono",monospace;color:var(--amber);font-weight:700}
.moat .mt{font-weight:600}.moat .md{color:var(--mute);font-size:14px}

/* shift two-col */
.cols{margin-top:28px;display:grid;grid-template-columns:1fr auto 1fr;gap:22px;align-items:center}
.col h4{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
.col.past h4{color:var(--mute)} .col.now h4{color:var(--amber)}
.col ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.col li{font-size:15px}.col.past li{color:var(--mute)}.col.now li{color:var(--bone)}
.cols .arrow{color:var(--amber);font-size:26px}
@media(max-width:720px){.cols{grid-template-columns:1fr;}.cols .arrow{transform:rotate(90deg)}}

/* loop pipeline */
.pipe{margin-top:30px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--bone)}
.pipe span{background:var(--surface);border:1px solid var(--edge);border-radius:8px;padding:7px 11px}
.pipe .arr{color:var(--amber);border:0;background:0}
.pipecap{margin-top:14px;color:var(--amber);font-size:13px;font-family:"JetBrains Mono",monospace}

/* ask */
.uses{margin-top:30px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.use{background:var(--surface);border:1px solid var(--edge);border-radius:12px;padding:18px}
.use .n{font-family:"JetBrains Mono",monospace;color:var(--amber);font-weight:700;font-size:20px}
.use .x{margin-top:8px;color:var(--mute);font-size:14px}
@media(max-width:720px){.uses{grid-template-columns:1fr}}

/* chrome */
#chrome{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;
  padding:0 24px;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--mute);pointer-events:none;z-index:40}
#chrome .wm{opacity:.6;font-weight:700;letter-spacing:.1em}
#nav{position:fixed;inset:0;z-index:30;display:flex}
#nav .half{flex:1;cursor:pointer}
#hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--mute);
  font-family:"JetBrains Mono",monospace;opacity:.5;z-index:41;pointer-events:none}
.placeholder{color:var(--amber-lit);background:rgba(233,185,73,.08);padding:1px 6px;border-radius:4px;font-family:"JetBrains Mono",monospace;font-size:.85em}

/* product shots */
.shots{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.frame{background:var(--surface);border:1px solid var(--edge);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.frame .bar{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--edge);background:var(--surface2)}
.frame .bar i{width:9px;height:9px;border-radius:50%;background:#3a3a44;display:inline-block}
.frame img{display:block;width:100%;height:auto}
.frame .shot{width:100%;aspect-ratio:16/10;height:auto;object-fit:cover;object-position:top center;background-color:var(--ink)}
.frame .cap{padding:10px 14px;font-size:13px;color:var(--mute);font-family:"JetBrains Mono",monospace}
.frame .cap b{color:var(--amber)}
.shotcap{margin-top:18px;text-align:center;color:var(--mute);font-size:14px}
@media(max-width:760px){.shots{grid-template-columns:1fr}}

/* plans */
.plans{margin-top:26px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.plan{background:var(--surface);border:1px solid var(--edge);border-radius:12px;padding:16px}
.plan.hl{border-color:var(--amber);box-shadow:0 0 28px rgba(200,145,42,.15)}
.plan .pn{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.plan .pp{font-weight:700;font-size:clamp(18px,2vw,24px);margin-top:6px}
.plan.hl .pp{color:var(--amber)}
.plan .pu{font-size:12px;color:var(--mute)}
@media(max-width:760px){.plans{grid-template-columns:1fr 1fr}}

/* roadmap timeline */
.road{margin-top:34px;display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative}
.road::before{content:"";position:absolute;top:14px;left:6%;right:6%;height:1px;background:var(--edge)}
.phase{position:relative;padding:0 12px}
.phase .pt{width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--amber);margin:8px auto 18px}
.phase.done .pt{background:var(--amber)}
.phase .pw{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);text-align:center;margin-bottom:10px}
.phase ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.phase li{font-size:13px;color:var(--mute);line-height:1.4}
.phase.done li{color:var(--bone)}
@media(max-width:760px){.road{grid-template-columns:1fr 1fr;gap:24px 0}.road::before{display:none}}

/* traction chart */
.chart{margin-top:30px;display:flex;align-items:flex-end;gap:14px;height:240px;border-bottom:1px solid var(--edge);padding-bottom:0}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;height:100%}
.bar .fill{width:100%;background:linear-gradient(180deg,var(--amber-lit),rgba(200,145,42,.25));border-radius:8px 8px 0 0;min-height:6px}
.bar .bl{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--mute)}
.chartcap{margin-top:14px;color:var(--mute);font-size:13px;font-family:"JetBrains Mono",monospace}

/* quote */
.quote{margin-top:10px}
.quote .q{font-size:clamp(24px,3.4vw,46px);font-weight:600;line-height:1.25;letter-spacing:-.02em}
.quote .q::before{content:"“";color:var(--amber);margin-right:.05em}
.quote .q::after{content:"”";color:var(--amber)}
.quote .by{margin-top:24px;color:var(--mute);font-family:"JetBrains Mono",monospace;font-size:14px}

/* demo QR */
.demo{margin-top:24px;display:flex;align-items:center;gap:40px;flex-wrap:wrap}
.demo img{width:200px;height:200px;border-radius:16px;border:1px solid var(--edge)}
.demo .dtxt{flex:1;min-width:240px}
.demo .dtxt .big{font-size:clamp(20px,2.2vw,30px);font-weight:600;line-height:1.3}
.demo .dtxt .url{margin-top:14px;font-family:"JetBrains Mono",monospace;color:var(--amber);font-size:15px}

/* funds */
.funds{margin-top:30px;display:flex;flex-direction:column;gap:14px}
.fund{display:flex;align-items:center;gap:14px}
.fund .fl{min-width:160px;font-size:15px;color:var(--bone)}
.fund .ftrack{flex:1;height:10px;background:var(--surface);border-radius:6px;overflow:hidden}
.fund .ffill{height:100%;background:linear-gradient(90deg,var(--amber),var(--amber-lit));border-radius:6px}
.fund .fp{font-family:"JetBrains Mono",monospace;color:var(--amber);font-size:14px;min-width:44px;text-align:right}

/* team */
.team{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.founder{background:var(--surface);border:1px solid var(--edge);border-radius:14px;padding:22px}
.founder .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--amber),var(--amber-lit));display:flex;align-items:center;justify-content:center;color:#000;font-weight:800;font-size:18px}
.founder .fn{font-weight:700;font-size:19px;margin-top:14px}
.founder .fr{color:var(--amber);font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.08em;margin-top:4px}
@media(max-width:760px){.team{grid-template-columns:1fr}}
</style>
</head>
<body data-lang="en">
<div id="prog"></div>

<div id="lang">
  <button data-l="en" class="on">EN</button>
  <button data-l="es">ES</button>
  <button data-l="pt">PT</button>
  <button data-l="zh">繁中</button>
</div>

<div id="nav"><div class="half" id="prev"></div><div class="half" id="next"></div></div>
<div id="stage"></div>

<div id="chrome"><span class="wm">SALLE</span><span id="ctr"></span></div>
<div id="hint" data-i18n-hint></div>

<script>
/* ---------- i18n helpers ---------- */
const HINT={en:"← → to navigate",es:"← → para navegar",pt:"← → para navegar",zh:"← → 翻頁"};
const CH={ // chapter labels per lang
  PROBLEM:{en:"THE PROBLEM",es:"EL PROBLEMA",pt:"O PROBLEMA",zh:"問題"},
  MARKET:{en:"THE MARKET",es:"EL MERCADO",pt:"O MERCADO",zh:"市場"},
  SHIFT:{en:"THE SHIFT",es:"EL CAMBIO",pt:"A VIRADA",zh:"拐點"},
  PLATFORM:{en:"THE PLATFORM",es:"LA PLATAFORMA",pt:"A PLATAFORMA",zh:"平台"},
  AI:{en:"THE AI LAYER",es:"LA CAPA DE IA",pt:"A CAMADA DE IA",zh:"AI 智能層"},
  GRAPH:{en:"THE HOSPITALITY GRAPH",es:"EL HOSPITALITY GRAPH",pt:"O HOSPITALITY GRAPH",zh:"餐飲圖譜"},
  LAND:{en:"THE LANDSCAPE",es:"EL PANORAMA",pt:"O CENÁRIO",zh:"競爭格局"},
  MOATS:{en:"THE MOATS",es:"LOS MOATS",pt:"OS MOATS",zh:"護城河"},
  BIZ:{en:"BUSINESS",es:"EL NEGOCIO",pt:"O NEGÓCIO",zh:"商業"},
  ROADMAP:{en:"THE ROADMAP",es:"EL ROADMAP",pt:"O ROADMAP",zh:"路線圖"},
  VISION:{en:"THE VISION",es:"LA VISIÓN",pt:"A VISÃO",zh:"願景"}

 document.body.dataset.lang=lang;
 let inner="";
 const kicker=s.ch?`<div class="kicker"><span class="n">${s.n}</span> — ${CH[s.ch][lang]}</div>`:"";
 const title=s.title?`<h1 class="t">${s.title[lang]}</h1>`:"";
 const sub=s.sub?`<div class="sub">${s.sub[lang]}</div>`:"";
 const body=s.body?`<div class="body">${lines(s.body[lang])}</div>`:"";
 const foot=s.foot?`<div class="foot">${s.foot[lang]}</div>`:"";
 let cls="slide show";

 if(s.type=="cover"){cls+=" center";inner=`<div class="wordmark">${s.title[lang]}</div><div class="uline"></div>${sub?`<div class="sub" style="margin-top:28px">${s.sub[lang]}</div>`:""}${foot}`;}
 else if(s.type=="center"){cls+=" center";inner=kicker+title+sub+body;}
 else if(s.type=="chapter"){cls+="";inner=kicker+title;}
 else if(s.type=="cards"){inner=title+`<div class="grid">${s.cards.map(c=>`<div class="card">${c}</div>`).join('')}</div><div class="disc">↑ ${s.disc[lang]} ↑</div>`;}
 else if(s.type=="stats"){inner=kicker+title+`<div class="stats">${s.stats.map(st=>`<div class="stat"><span class="v ${st.c}">${st.v}</span><span class="l">${st.l[lang]}</span></div>`).join('')}</div>`+foot;}
 else if(s.type=="tam"){inner=title+`<div class="tam">${s.rings.map((r,x)=>`<div class="ring s${x+1}"><div class="lab">${r.lab}</div><div class="v">${r.v}</div><div class="d">${r.d[lang]}</div></div>`).join('')}</div>`+foot;}
 else if(s.type=="ladder"){inner=title+`<div class="ladder">${s.steps.map(st=>`<div class="lstep"><div class="h">${st.h}</div><div>${st.t[lang]}</div></div>`).join('')}</div>`+body;}
 else if(s.type=="shift"){const c=o=>`<div class="col ${o.cls}"><h4>${o.h[lang]}</h4><ul>${o.li[lang].map(x=>`<li>${x}</li>`).join('')}</ul></div>`;inner=title+`<div class="cols">${c({...s.past,cls:'past'})}<div class="arrow">→</div>${c({...s.now,cls:'now'})}</div>`;}
 else if(s.type=="rows"){inner=kicker+title+`<div class="rows">${s.rows.map(r=>{const ld=(typeof r.lead==='string')?r.lead:r.lead[lang];return `<div class="row"><span class="lead">${ld}</span><span class="txt">${r.t[lang]}</span></div>`;}).join('')}</div>`;}
 else if(s.type=="product"){inner=title+`<div class="shots">
   <div class="frame"><div class="bar"><i></i><i></i><i></i></div><img class="shot" src="${IMG_MENU}" alt="QR menu" loading="eager" decoding="sync"><div class="cap">${s.capA[lang]}</div></div>
   <div class="frame"><div class="bar"><i></i><i></i><i></i></div><img class="shot" src="${IMG_BOOK}" alt="Reservations" loading="eager" decoding="sync"><div class="cap">${s.capB[lang]}</div></div>
 </div><div class="shotcap">${s.shotcap[lang]}</div>`;}
 else if(s.type=="plans"){inner=title+`<div class="plans">${s.plans.map(p=>`<div class="plan ${p.hl?'hl':''}"><div class="pn">${p.n}</div><div class="pp">${p.p}</div></div>`).join('')}</div><div class="shotcap" style="margin-top:14px">${s.unit[lang]}</div><div class="body" style="margin-top:14px">${s.foot[lang]}</div>`;}
 else if(s.type=="team"){inner=title+`<div class="team">${s.founders.map(f=>`<div class="founder"><div class="av">${f.initials}</div><div class="fn">${f.name}</div><div class="fr">${f.role}</div></div>`).join('')}</div><div class="body" style="margin-top:24px">${lines(s.body[lang])}</div>`;}
 else if(s.type=="demo"){inner=title+`<div class="demo"><img src="${IMG_QR}" alt="QR"><div class="dtxt"><div class="big">${s.big[lang]}</div><div class="url">↗ ${s.url}</div></div></div>`;}
 else if(s.type=="chart"){const mx=Math.max(...s.bars.map(b=>b.h));inner=title+`<div class="chart">${s.bars.map(b=>`<div class="bar"><div class="fill" style="height:${Math.round(b.h/mx*100)}%"></div><div class="bl">${b.l}</div></div>`).join('')}</div><div class="chartcap">↗ ${s.cap[lang]}</div>`;}
 else if(s.type=="quote"){cls+=" center";inner=`<div class="quote"><div class="q">${s.q[lang]}</div><div class="by">— ${s.by[lang]}</div></div>`;}
 else if(s.type=="roadmap"){inner=kicker+title+`<div class="road">${s.phases.map(p=>`<div class="phase ${p.done?'done':''}"><div class="pt"></div><div class="pw">${p.w}</div><ul>${p.li[lang].map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>`;}
 else if(s.type=="funds"){inner=title+`<div class="funds">${s.items.map(f=>`<div class="fund"><span class="fl">${f.l[lang]}</span><span class="ftrack"><span class="ffill" style="width:${f.pct}%"></span></span><span class="fp">${f.pct}%</span></div>`).join('')}</div><div class="shotcap" style="margin-top:18px">${s.foot[lang]}</div>`;}
 else if(s.type=="arch"){inner=title+archHTML();}
 else if(s.type=="flywheel"){cls+=" center";inner=title+flyHTML(s);}
 else if(s.type=="matrix"){inner=title+matrixHTML();}
 else if(s.type=="table"){inner=title+tableHTML();}
 else if(s.type=="moats"){inner=title+`<div class="moats">${s.items.map((m,x)=>`<div class="moat"><span class="num">${x+1}</span><span class="mt">${m.t[lang]}</span><span class="md">— ${m.d[lang]}</span></div>`).join('')}</div>`;}
 else if(s.type=="loop"){inner=title+`<div class="pipe">${s.steps[lang].map((x,idx)=>`${idx?'<span class="arr">→</span>':''}<span>${x}</span>`).join('')}</div><div class="pipecap">↳ ${s.cap[lang]}</div>`;}
 else if(s.type=="ask"){inner=title+`<div class="sub" style="margin-top:20px"><span class="am" style="font-weight:700">${s.amount[lang]}</span></div><div class="uses">${s.uses.map(u=>`<div class="use"><div class="n">${u.n}</div><div class="x">${u.x[lang]}</div></div>`).join('')}</div>`+foot;}
 else {inner=kicker+title+sub+body+foot;}

 stage.innerHTML=`<div class="${cls}">${inner}</div>`;
 document.getElementById('prog').style.width=((i)/(D.length-1)*100)+"%";
 document.getElementById('ctr').textContent=String(i+1).padStart(2,'0')+" / "+D.length;
 document.getElementById('hint').textContent=HINT[lang];
}
function go(d){i=Math.max(0,Math.min(D.length-1,i+d));location.hash=i+1;render();}
document.getElementById('next').onclick=()=>go(1);
document.getElementById('prev').onclick=()=>go(-1);
document.addEventListener('keydown',e=>{
 if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown")go(1);
 else if(e.key==="ArrowLeft"||e.key==="PageUp")go(-1);
 else if(e.key==="Home"){i=0;render();}
 else if(e.key==="End"){i=D.length-1;render();}
});
document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{
 lang=b.dataset.l;
 document.querySelectorAll('#lang button').forEach(x=>x.classList.toggle('on',x===b));
 render();
});
const _hs=parseInt((location.hash||'').replace('#',''),10);
if(_hs>=1&&_hs<=D.length)i=_hs-1;
render();
</script>
</body>
</html>
