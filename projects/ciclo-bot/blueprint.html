<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Método CICLO · Blueprint del Bot de WhatsApp</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#262d36; --text:#e6edf3;
    --muted:#8b949e; --accent:#3fb950; --accent2:#58a6ff; --code:#0b0f14;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--text);display:flex;min-height:100vh}
  #sidebar{width:320px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);
           height:100vh;overflow-y:auto;position:sticky;top:0;padding:0}
  #sidebar header{padding:20px 18px;border-bottom:1px solid var(--border)}
  #sidebar h1{font-size:15px;margin:0;color:var(--accent)}
  #sidebar p{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.4}
  nav a{display:block;padding:9px 18px;color:var(--text);text-decoration:none;font-size:13.5px;
        border-left:3px solid transparent;line-height:1.35}
  nav a small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
  nav a:hover{background:#1c232c}
  nav a.active{border-left-color:var(--accent);background:#1c232c;color:var(--accent)}
  main{flex:1;overflow-y:auto;height:100vh}
  #content{max-width:860px;margin:0 auto;padding:48px 40px 120px}
  #content h1{border-bottom:1px solid var(--border);padding-bottom:12px;color:#fff}
  #content h2{margin-top:34px;color:var(--accent2)}
  #content h3{color:#d2a8ff}
  #content a{color:var(--accent2)}
  #content code{background:var(--code);padding:2px 6px;border-radius:5px;font-size:13px}
  #content pre{background:var(--code);padding:16px;border-radius:8px;overflow-x:auto;
               border:1px solid var(--border);font-size:12.5px;line-height:1.45}
  #content pre code{background:none;padding:0}
  #content table{border-collapse:collapse;width:100%;margin:16px 0;font-size:13.5px}
  #content th,#content td{border:1px solid var(--border);padding:8px 10px;text-align:left}
  #content th{background:#1c232c}
  #content blockquote{border-left:3px solid var(--accent);margin:16px 0;padding:4px 16px;
                      color:var(--muted);background:#12171e}
  .err{color:#f85149;padding:24px;background:#1c232c;border-radius:8px;line-height:1.6}
  .err code{background:var(--code);padding:2px 6px;border-radius:4px}
  @media(max-width:780px){#sidebar{position:fixed;left:-320px;transition:.2s;z-index:9}
    #sidebar.open{left:0}body{flex-direction:column}}
</style>
</head>
<body>
<aside id="sidebar">
  <header>
    <h1>MÉTODO CICLO</h1>
    <p>Blueprint del Bot de WhatsApp · Enterprise</p>
  </header>
  <nav id="nav"></nav>
</aside>
<main><div id="content">Cargando…</div></main>

<script>
const DOCS = [
  ["00-README-INDICE-MAESTRO.md","Índice maestro","Mapa y principios"],
  ["01-ARQUITECTURA.md","01 · Arquitectura","Stack, RAG, FSM, datos"],
  ["02-FLUJOS.md","02 · Flujos","Los 14 flujos"],
  ["03-ARBOL-CONVERSACIONAL.md","03 · Árbol conversacional","Estados y transiciones"],
  ["04-PROMPTS-SISTEMA.md","04 · Prompts de sistema","System, router, guardrails"],
  ["05-PROMPTS-DISCOVERY-VENTAS-NURTURING.md","05 · Prompts especializados","Discovery/ventas/nurturing"],
  ["06-BASE-CONOCIMIENTO.md","06 · Base de conocimiento","Empresa, pricing, casos"],
  ["07-OBJECIONES.md","07 · Objeciones","Biblioteca enterprise"],
  ["08-LEAD-SCORING.md","08 · Lead scoring","Modelo A/B/C/D"],
  ["09-CRM.md","09 · CRM","Pipeline y triggers"],
  ["10-INTEGRACIONES.md","10 · Integraciones","Agenda, tools, WhatsApp"],
  ["11-DASHBOARD.md","11 · Dashboard","KPIs y embudo"],
  ["12-DEMOS.md","12 · Demos","Inversores y clientes"],
  ["13-ROADMAP.md","13 · Roadmap","Plan por fases"],
  ["14-MANUAL-OPERATIVO.md","14 · Manual operativo","Operación diaria"],
  ["15-ESCALABILIDAD-LATAM.md","15 · Escalabilidad LATAM","Multi-país"],
];

const nav = document.getElementById('nav');
const content = document.getElementById('content');

DOCS.forEach(([file,title,desc],i)=>{
  const a=document.createElement('a');
  a.href='#'+file; a.dataset.file=file;
  a.innerHTML = title + '<small>'+desc+'</small>';
  nav.appendChild(a);
});

async function load(file){
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.file===file));
  try{
    const res = await fetch(file);
    if(!res.ok) throw new Error(res.status);
    const md = await res.text();
    content.innerHTML = marked.parse(md);
    // re-rutear links internos a otros .md
    content.querySelectorAll('a[href$=".md"]').forEach(a=>{
      const f = a.getAttribute('href').split('/').pop();
      a.addEventListener('click',e=>{e.preventDefault();location.hash=f;});
    });
    main.scrollTo(0,0);
  }catch(e){
    content.innerHTML = `<div class="err">
      <b>No se pudo cargar <code>${file}</code> (error ${e.message}).</b><br><br>
      Los navegadores bloquean <code>fetch()</code> de archivos locales por <code>file://</code>.
      Serví la carpeta con un servidor estático y abrí <code>http://localhost:8080/blueprint.html</code>:
      <pre>cd "metodo-ciclo-bot"
npx serve .      # o:  python -m http.server 8080</pre>
      Alternativamente, abrí los <code>.md</code> directamente en tu editor.
    </div>`;
  }
}
const main = document.querySelector('main');
function route(){ load(location.hash.slice(1) || DOCS[0][0]); }
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
