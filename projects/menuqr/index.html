<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MenuQR — Sistema Integrado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:#09090B;color:#F0EBE1;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{cursor:pointer;font-family:inherit;border:none;background:none}
input,textarea,select{font-family:inherit;border:none;outline:none;background:none}
img{display:block}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:#32323A;border-radius:2px}

:root{
  --bg:#09090B;--bg2:#111115;--bg3:#17171C;--bg4:#1E1E25;--bg5:#252530;
  --b:#252529;--b2:#32323A;--b3:#3E3E48;
  --t:#F0EBE1;--t2:#8C8880;--t3:#52504C;
  --a:#C8912A;--a2:#E0A83A;--abg:#C8912A12;--ab:#C8912A30;
  --mp:#009EE3;--mpbg:#009EE310;--mpb:#009EE330;
  --g:#3B7A58;--gbg:#3B7A5812;--gb:#3B7A5830;--gt:#5EAF85;
  --r:#B84040;--rbg:#B8404012;--rb:#B8404030;--rt:#E07070;
  --bl:#3A6EA8;--blbg:#3A6EA812;--blb:#3A6EA830;--blt:#6EA8E0;
  --obg:#C85A2A18;--ot:#E09A70;
  --rad:13px;--rads:8px;--radxs:5px;--pill:100px;
  --shad:0 4px 24px rgba(0,0,0,.5);
}

/* ══ DEMO BAR ══ */
#demo-bar{
  position:fixed;top:0;left:0;right:0;z-index:9999;
  background:#000;border-bottom:1px solid #1a1a1a;
  display:flex;align-items:center;gap:5px;
  padding:7px 12px;overflow-x:auto;white-space:nowrap;
}
#demo-bar::-webkit-scrollbar{display:none}
.dl{font-size:9px;letter-spacing:1.5px;color:#333;text-transform:uppercase;flex-shrink:0;margin-right:2px}
.db{padding:5px 13px;border-radius:var(--pill);font-size:11px;font-weight:500;border:1px solid #222;color:#444;flex-shrink:0;transition:all .18s;cursor:pointer}
.db.act{background:var(--a);color:#000;border-color:var(--a)}
.dsep{width:1px;height:14px;background:#222;flex-shrink:0;margin:0 2px}

/* ══ PAGES ══ */
.pg{display:none;padding-top:36px}
.pg.act{display:block}

/* ══════════ MENU STYLES ══════════ */
.mwrap{max-width:480px;margin:0 auto;min-height:calc(100vh - 36px)}

/* HERO */
.hero{position:relative;height:260px;overflow:hidden;background:var(--bg3)}
.hero-img{width:100%;height:100%;object-fit:cover;filter:brightness(.58);transform:scale(1.04);transition:transform 6s ease}
.hero.rdy .hero-img{transform:scale(1)}
.hero-grad{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(9,9,11,0) 30%,rgba(9,9,11,.9) 100%)}
.hero-btns{position:absolute;top:13px;right:13px;display:flex;gap:7px}
.hero-ico{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center}
.hero-ico svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero-txt{position:absolute;bottom:0;left:0;right:0;padding:18px 18px 22px}
.hero-eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--a);margin-bottom:5px;font-weight:500}
.hero-name{font-family:'Fraunces',serif;font-size:34px;font-weight:300;color:var(--t);line-height:1.1}
.hero-sub{font-size:12px;color:rgba(240,235,225,.55);margin-top:4px}

/* STICKY HEADER */
.mhdr{position:sticky;top:36px;z-index:80;background:rgba(9,9,11,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--b)}
.mhdr-top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 9px}
.mlogo-wrap{display:flex;align-items:center;gap:9px}
.mlogo{width:33px;height:33px;border-radius:8px;background:var(--a);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:13px;color:#000;flex-shrink:0}
.mhdr-name{font-family:'Fraunces',serif;font-size:17px;font-weight:400;color:var(--t)}
.mhdr-sub{font-size:10px;color:var(--t3);margin-top:1px}
.mhdr-right{display:flex;align-items:center;gap:7px}
.mesa-chip{display:flex;align-items:center;gap:4px;padding:4px 9px;background:var(--bg3);border:1px solid var(--b);border-radius:var(--pill);font-size:11px;color:var(--t2)}
.mesa-n{font-weight:600;color:var(--a)}
.lang-sw{display:flex;background:var(--bg3);border:1px solid var(--b);border-radius:var(--pill);padding:2px}
.lb{padding:4px 8px;border-radius:var(--pill);font-size:11px;font-weight:500;color:var(--t3);transition:all .18s}
.lb.act{background:var(--a);color:#000}

/* SEARCH */
.msearch{padding:10px 14px 0}
.msearch-box{display:flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--b);border-radius:var(--pill);padding:0 13px;height:40px;transition:border-color .15s}
.msearch-box:focus-within{border-color:var(--b2)}
.msearch-box svg{width:13px;height:13px;fill:none;stroke:var(--t3);stroke-width:2;stroke-linecap:round;flex-shrink:0}
.msearch-box input{flex:1;font-size:13px;color:var(--t);background:transparent}
.msearch-box input::placeholder{color:var(--t3)}
.sclear{color:var(--t3);font-size:18px;line-height:1;padding:0 2px}

/* FILTERS */
.mfilt{display:flex;gap:6px;padding:9px 14px;overflow-x:auto;white-space:nowrap}
.mfilt::-webkit-scrollbar{display:none}
.fchip{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:var(--pill);font-size:12px;color:var(--t2);background:var(--bg3);border:1px solid var(--b);flex-shrink:0;transition:all .18s}
.fchip.act{background:var(--abg);border-color:var(--ab);color:var(--a)}
.fchip svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2}

/* CATEGORIES */
.mcats{display:flex;gap:6px;padding:3px 14px 11px;overflow-x:auto;border-bottom:1px solid var(--b)}
.mcats::-webkit-scrollbar{display:none}
.cpill{padding:6px 15px;border-radius:var(--pill);font-size:13px;color:var(--t3);background:transparent;border:1px solid var(--b);white-space:nowrap;flex-shrink:0;transition:all .18s}
.cpill.act{background:var(--t);color:var(--bg);border-color:var(--t);font-weight:500}

/* PRODUCT GRID */
.mprods{padding:0 11px 40px}
.cg{margin-top:22px}
.cg-hd{font-family:'Fraunces',serif;font-size:21px;font-weight:400;color:var(--t);padding:0 3px;margin-bottom:11px;display:flex;align-items:center;gap:9px}
.cg-line{flex:1;height:1px;background:var(--b)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.pcard{background:var(--bg2);border:1px solid var(--b);border-radius:var(--rad);overflow:hidden;cursor:pointer;transition:border-color .18s,transform .12s;position:relative}
.pcard:active{transform:scale(.975)}
.pcard.so{opacity:.5}
.pcard-img{aspect-ratio:1/1;position:relative;overflow:hidden;background:var(--bg3)}
.pcard-img img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.pcard:hover .pcard-img img{transform:scale(1.05)}
.p-so{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.78);color:var(--t2);font-size:10px;font-weight:500;padding:3px 8px;border-radius:var(--pill);backdrop-filter:blur(4px)}
.p-ph{position:absolute;top:7px;right:7px;background:rgba(0,0,0,.65);color:rgba(255,255,255,.8);font-size:10px;padding:3px 7px;border-radius:var(--pill);backdrop-filter:blur(4px)}
.p-al{position:absolute;bottom:7px;left:7px;display:flex;gap:3px}
.al-dot{width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;font-size:9px;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.1)}
.pbody{padding:10px 11px 12px}
.pname{font-family:'Fraunces',serif;font-size:14px;font-weight:400;color:var(--t);line-height:1.25;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pdesc{font-size:11px;color:var(--t2);line-height:1.4;margin-bottom:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pfoot{display:flex;align-items:center;justify-content:space-between}
.pprice{font-size:14px;font-weight:500;color:var(--a)}
.pcb{font-size:10px;background:var(--abg);color:var(--a);border:1px solid var(--ab);padding:2px 7px;border-radius:var(--pill)}

/* GOOGLE REVIEWS */
.mdiv{display:flex;align-items:center;gap:9px;padding:22px 14px 12px;font-size:11px;color:var(--t3);letter-spacing:.5px}
.mdiv::before,.mdiv::after{content:'';flex:1;height:1px;background:var(--b)}
.gcard{background:var(--bg2);border:1px solid var(--b);border-radius:var(--rad);padding:13px;margin:0 11px 9px}
.ghead{display:flex;gap:9px;align-items:flex-start;margin-bottom:7px}
.gav{width:32px;height:32px;border-radius:50%;flex-shrink:0;background:var(--a);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:#000}
.gname{font-size:13px;font-weight:500;color:var(--t)}
.gmeta{display:flex;align-items:center;gap:5px;margin-top:2px}
.gst{color:var(--a);font-size:10px;letter-spacing:-1px}
.gtime{font-size:11px;color:var(--t3)}
.gtxt{font-size:13px;color:var(--t2);line-height:1.5}
.gsee{display:flex;align-items:center;justify-content:center;gap:6px;margin:0 11px 32px;padding:12px;background:var(--bg2);border:1px solid var(--b);border-radius:var(--rad);font-size:13px;color:var(--t2)}
.gsee svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2}

/* ══ PRODUCT MODAL ══ */
.ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0);transition:background .22s;pointer-events:none;overflow-y:auto;top:36px}
.ov.act{background:rgba(0,0,0,.85);pointer-events:all}
.msheet{background:var(--bg2);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,0,.67,0);margin-top:60px;position:relative;min-height:60vh}
.ov.act .msheet{transform:translateY(0)}
.mhandle{width:36px;height:4px;border-radius:2px;background:var(--b2);margin:10px auto 0}
.mclose{position:absolute;top:10px;right:12px;width:31px;height:31px;border-radius:50%;background:var(--bg4);border:1px solid var(--b);color:var(--t2);font-size:17px;display:flex;align-items:center;justify-content:center;z-index:5}

/* CAROUSEL */
.mcar{position:relative;height:255px;background:var(--bg3);overflow:hidden;margin-top:8px}
.mcar img{width:100%;height:100%;object-fit:cover}
.cabtn{position:absolute;top:50%;transform:translateY(-50%);width:33px;height:33px;border-radius:50%;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);color:var(--t);font-size:22px;display:flex;align-items:center;justify-content:center;z-index:5;transition:opacity .15s}
.cabtn.hid{opacity:0;pointer-events:none}
.cprev{left:9px}.cnext{right:9px}
.cdots{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);display:flex;gap:5px;align-items:center}
.cdot{height:4px;border-radius:2px;background:rgba(255,255,255,.3);transition:all .22s}
.cdot.act{background:var(--a);width:18px}
.cdot:not(.act){width:4px}

.mbody{padding:17px 15px 44px}
.mtr{display:flex;align-items:flex-start;justify-content:space-between;gap:9px;margin-bottom:7px}
.mmodn{font-family:'Fraunces',serif;font-size:22px;font-weight:400;color:var(--t);line-height:1.2;flex:1}
.modp{font-size:20px;font-weight:500;color:var(--a);flex-shrink:0;padding-top:3px}
.altags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.altag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--pill);font-size:11px;color:var(--t2);background:var(--bg4);border:1px solid var(--b)}
.mdesc{font-size:14px;color:var(--t2);line-height:1.65;margin-bottom:16px}

/* ADD TO CART */
.atc{background:var(--bg3);border:1px solid var(--b);border-radius:var(--rad);padding:13px;margin-bottom:13px}
.atc-lbl{font-size:11px;color:var(--t3);margin-bottom:9px}
.atc-row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.qty{display:flex;align-items:center;background:var(--bg4);border:1px solid var(--b);border-radius:var(--pill)}
.qb{width:33px;height:33px;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--t2)}
.qv{min-width:26px;text-align:center;font-size:14px;font-weight:500;color:var(--t)}
.ntxt{width:100%;background:var(--bg4);border:1px solid var(--b);color:var(--t);padding:8px 11px;border-radius:var(--rads);font-size:13px;resize:none;line-height:1.5}
.ntxt::placeholder{color:var(--t3)}
.btn-atc{width:100%;padding:12px;background:var(--a);color:#000;border-radius:var(--rad);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;transition:opacity .15s}
.btn-atc:active{opacity:.85}
.btn-ig{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px;border-radius:var(--rad);background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:#fff;font-size:13px;font-weight:500;margin-bottom:16px}
.btn-ig svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* REVIEWS IN MODAL */
.revsec{border-top:1px solid var(--b);padding-top:15px}
.revhdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.revttl{font-size:14px;font-weight:500;color:var(--t)}
.ravg{display:flex;align-items:center;gap:4px}
.rlist{display:flex;flex-direction:column;gap:8px;max-height:210px;overflow-y:auto}
.ritem{background:var(--bg3);border-radius:var(--rads);padding:10px 11px}
.rrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.rusr{font-size:13px;font-weight:500;color:var(--t)}
.rdate{font-size:11px;color:var(--t3)}
.rtxt{font-size:13px;color:var(--t2);line-height:1.45}
.norev{text-align:center;padding:18px 0;color:var(--t3);font-size:13px}

/* ══ CART FAB ══ */
.cfab{position:fixed;bottom:24px;right:16px;z-index:190;background:var(--a);color:#000;width:54px;height:54px;border-radius:50%;box-shadow:0 4px 20px rgba(200,145,42,.45);display:none;align-items:center;justify-content:center;transition:transform .18s}
.cfab.vis{display:flex}
.cfab:active{transform:scale(.92)}
.cfab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cbadge{position:absolute;top:-2px;right:-2px;width:19px;height:19px;border-radius:50%;background:#000;color:var(--a);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--a)}

/* Cart header button — always visible in premium */
.chbtn{
  display:flex;align-items:center;gap:5px;
  padding:6px 11px 6px 9px;border-radius:var(--pill);
  font-size:12px;font-weight:600;transition:all .15s;
  background:var(--bg3);border:1px solid var(--b);color:var(--t2);
}
.chbtn.has-items{background:var(--a);border-color:var(--a);color:#000}
.chbtn:active{opacity:.85}
.chbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;flex-shrink:0}
.chbtn-n{font-size:11px;font-weight:700;min-width:16px;text-align:center}

/* ══ CART SHEET ══ */
.cov{position:fixed;inset:0;z-index:210;background:rgba(0,0,0,0);transition:background .22s;pointer-events:none;top:36px}
.cov.act{background:rgba(0,0,0,.85);pointer-events:all}
.csheet{position:absolute;bottom:0;left:0;right:0;background:var(--bg2);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,0,.67,0);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.cov.act .csheet{transform:translateY(0)}
.chdr{display:flex;align-items:center;justify-content:space-between;padding:14px 15px 12px;border-bottom:1px solid var(--b);flex-shrink:0}
.cttl{font-size:15px;font-weight:500;color:var(--t)}
.cmesa{font-size:12px;color:var(--t2)}
.cclose{width:29px;height:29px;border-radius:50%;background:var(--bg3);border:1px solid var(--b);color:var(--t2);font-size:16px;display:flex;align-items:center;justify-content:center}
.citems{flex:1;overflow-y:auto;padding:7px 13px}
.ci{display:flex;gap:9px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--b)}
.ci:last-child{border-bottom:none}
.ci-img{width:50px;height:50px;border-radius:var(--rads);overflow:hidden;flex-shrink:0;background:var(--bg3)}
.ci-img img{width:100%;height:100%;object-fit:cover}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:13px;font-weight:500;color:var(--t);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-note{font-size:11px;color:var(--t3);margin-bottom:5px;line-height:1.3}
.ci-bot{display:flex;align-items:center;justify-content:space-between}
.ci-price{font-size:13px;color:var(--a);font-weight:500}
.ciqty{display:flex;align-items:center;background:var(--bg4);border:1px solid var(--b);border-radius:var(--pill)}
.ciqb{width:27px;height:27px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--t2)}
.ciqv{min-width:20px;text-align:center;font-size:12px;color:var(--t)}
.ci-del{color:var(--t3);font-size:16px;padding:2px 5px;flex-shrink:0}
.cempty{text-align:center;padding:36px 20px;color:var(--t3);font-size:14px}
.cfoot{border-top:1px solid var(--b);padding:13px 15px 28px;flex-shrink:0}
.csrow{display:flex;justify-content:space-between;margin-bottom:4px}
.csrow span:first-child{font-size:13px;color:var(--t2)}
.csrow span:last-child{font-size:13px;color:var(--t)}
.ctrow{display:flex;justify-content:space-between;padding:10px 0 0;border-top:1px solid var(--b);margin-top:4px}
.ctl{font-size:15px;font-weight:500;color:var(--t)}
.ctv{font-size:18px;font-weight:600;color:var(--a)}
.btn-co{width:100%;padding:13px;border-radius:var(--rad);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;margin-top:0;border:none}
.btn-co:active{opacity:.85}
.btn-co svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;flex-shrink:0}
.btn-co.mp{background:var(--mp);color:#fff}
.btn-co.cash{background:var(--gbg);border:1px solid var(--gb);color:var(--gt)}
.btn-co.later{background:var(--bg4);border:1px solid var(--b2);color:var(--t2)}
.pay-opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pay-sep{display:flex;align-items:center;gap:8px;margin:2px 0}
.pay-sep::before,.pay-sep::after{content:'';flex:1;height:1px;background:var(--b)}
.pay-sep span{font-size:10px;color:var(--t3);letter-spacing:.5px;text-transform:uppercase}
.cterms{font-size:11px;color:var(--t3);text-align:center;margin-top:7px}
/* Payment badge on kanban */
.kpay{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:500;padding:2px 7px;border-radius:var(--pill);margin-top:4px}
.kpay-mp{background:var(--mpbg);color:var(--mp);border:1px solid var(--mpb)}
.kpay-cash{background:var(--gbg);color:var(--gt);border:1px solid var(--gb)}
.kpay-later{background:var(--bg4);color:var(--t3);border:1px solid var(--b2)}

/* ══ FILTER SHEET ══ */
.fov{position:fixed;inset:0;z-index:220;background:rgba(0,0,0,0);transition:background .2s;pointer-events:none;top:36px}
.fov.act{background:rgba(0,0,0,.8);pointer-events:all}
.fsheet{position:absolute;bottom:0;left:0;right:0;background:var(--bg2);border-radius:20px 20px 0 0;padding:0 15px 36px;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,0,.67,0)}
.fov.act .fsheet{transform:translateY(0)}
.fhandle{width:36px;height:4px;border-radius:2px;background:var(--b2);margin:10px auto 15px}
.fttl{font-size:14px;font-weight:500;color:var(--t);margin-bottom:11px}
.algrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.ab{display:flex;align-items:center;gap:7px;padding:9px 11px;border-radius:var(--rads);border:1px solid var(--b);background:var(--bg3);font-size:13px;color:var(--t2);transition:all .15s;cursor:pointer}
.ab.act{border-color:var(--ab);background:var(--abg);color:var(--a)}
.psort{display:flex;gap:6px;margin-bottom:14px}
.psb{flex:1;padding:10px;border-radius:var(--rads);border:1px solid var(--b);background:var(--bg3);font-size:13px;color:var(--t2);transition:all .15s}
.psb.act{border-color:var(--ab);background:var(--abg);color:var(--a)}
.btn-apply{width:100%;padding:13px;border-radius:var(--rad);background:var(--a);color:#000;font-size:14px;font-weight:500}

/* ══════════ ADMIN STYLES ══════════ */
.aapp{display:flex;height:calc(100vh - 36px)}
.asidebar{width:220px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--b);display:flex;flex-direction:column;height:100%;overflow-y:auto}
.amain{flex:1;min-width:0;height:100%;overflow-y:auto}

/* Sidebar */
.asbrand{display:flex;align-items:center;gap:9px;padding:16px 14px 13px;border-bottom:1px solid var(--b)}
.aslogo{width:31px;height:31px;border-radius:7px;background:var(--a);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:12px;color:#000;flex-shrink:0}
.asname{font-size:13px;font-weight:500;color:var(--t);line-height:1.2}
.asplan{display:inline-block;font-size:9px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;padding:2px 7px;border-radius:var(--pill);background:var(--abg);border:1px solid var(--ab);color:var(--a);margin-top:2px}
.asnav{flex:1;padding:9px 7px}
.nsec{font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--t3);padding:9px 8px 5px;display:block}
.ni{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:var(--rads);font-size:13px;color:var(--t2);transition:all .15s;margin-bottom:1px;cursor:pointer;width:100%;text-align:left}
.ni:hover{background:var(--bg3);color:var(--t)}
.ni.act{background:var(--bg4);color:var(--t);font-weight:500}
.ni.act .nico{color:var(--a)}
.nico{font-size:14px;width:17px;text-align:center;flex-shrink:0}
.nbadge{margin-left:auto;min-width:17px;height:17px;border-radius:var(--pill);padding:0 5px;background:var(--abg);border:1px solid var(--ab);font-size:10px;font-weight:600;color:var(--a);display:flex;align-items:center;justify-content:center}
.asfoot{padding:10px 7px 14px;border-top:1px solid var(--b)}
.asusr{display:flex;align-items:center;gap:7px;padding:8px 9px}
.asav{width:28px;height:28px;border-radius:50%;background:var(--bg4);border:1px solid var(--b2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--t2);flex-shrink:0}
.asun{font-size:12px;font-weight:500;color:var(--t);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asrole{font-size:10px;color:var(--t3)}
.btn-lo{color:var(--t3);font-size:12px;padding:2px 4px}

/* Admin topbar */
.atbar{display:flex;align-items:center;justify-content:space-between;padding:15px 22px;border-bottom:1px solid var(--b);background:var(--bg2);position:sticky;top:0;z-index:50}
.attl{font-family:'Fraunces',serif;font-size:21px;font-weight:300;color:var(--t)}
.atsub{font-size:12px;color:var(--t3);margin-top:2px}
.atright{display:flex;align-items:center;gap:8px}
.btn-pri{display:inline-flex;align-items:center;gap:5px;padding:8px 15px;background:var(--a);color:#000;border-radius:var(--rads);font-size:13px;font-weight:600;transition:opacity .15s;white-space:nowrap}
.btn-pri:active{opacity:.85}
.btn-sec{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;background:var(--bg3);border:1px solid var(--b2);color:var(--t2);border-radius:var(--rads);font-size:13px;transition:all .15s;white-space:nowrap}
.btn-sec:hover{border-color:var(--b3);color:var(--t)}

.apbody{padding:20px}
.acard{background:var(--bg2);border:1px solid var(--b);border-radius:var(--rad);overflow:hidden;margin-bottom:14px}
.acbody{padding:18px}
.achead{padding:14px 18px;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between}
.acttl{font-size:14px;font-weight:500;color:var(--t)}
.acsub{font-size:12px;color:var(--t3);margin-top:2px}

/* Table */
.twrap{overflow-x:auto}
.atbl{width:100%;border-collapse:collapse}
.atbl th{font-size:10px;font-weight:500;color:var(--t3);letter-spacing:.5px;text-align:left;padding:9px 15px;border-bottom:1px solid var(--b);white-space:nowrap;text-transform:uppercase}
.atbl td{padding:11px 15px;border-bottom:1px solid var(--b);vertical-align:middle}
.atbl tr:last-child td{border-bottom:none}
.atbl tr:hover td{background:var(--bg3)}
.pthumb{width:42px;height:42px;border-radius:var(--radxs);overflow:hidden;background:var(--bg3)}
.pthumb img{width:100%;height:100%;object-fit:cover}
.prn{font-size:13px;font-weight:500;color:var(--t);margin-bottom:2px}
.prs{font-size:11px;color:var(--t3)}

/* Pills */
.spill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:var(--pill);font-size:11px;font-weight:500}
.sc{background:var(--obg);color:var(--ot);border:1px solid rgba(200,90,42,.2)}
.sb{background:var(--mpbg);color:var(--mp);border:1px solid var(--mpb)}
.stpill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--pill);font-size:11px;font-weight:500}
.st-a{background:var(--gbg);color:var(--gt);border:1px solid var(--gb)}
.st-s{background:var(--rbg);color:var(--rt);border:1px solid var(--rb)}
.st-h{background:var(--bg4);color:var(--t3);border:1px solid var(--b2)}

/* Row actions */
.ract{display:flex;align-items:center;gap:3px}
.ib{width:29px;height:29px;border-radius:var(--radxs);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--t3);transition:all .15s}
.ib:hover{background:var(--bg4);color:var(--t)}
.ib.del:hover{background:var(--rbg);color:var(--rt)}

/* Toggle */
.tog{position:relative;width:35px;height:19px;cursor:pointer;flex-shrink:0;display:inline-block}
.tog input{opacity:0;width:0;height:0;position:absolute}
.togtr{position:absolute;inset:0;border-radius:10px;background:var(--bg4);border:1px solid var(--b2);transition:all .2s}
.tog input:checked+.togtr{background:var(--g);border-color:var(--g)}
.togkn{position:absolute;top:3px;left:3px;width:13px;height:13px;border-radius:50%;background:var(--t3);transition:all .2s}
.tog input:checked~.togkn{left:19px;background:#fff}

/* Form elements */
.fg{display:grid;gap:15px}
.fg2{grid-template-columns:1fr 1fr}
.fr{display:flex;flex-direction:column;gap:5px}
.fl{font-size:12px;font-weight:500;color:var(--t2)}
.fh{font-size:11px;color:var(--t3);margin-top:2px}
.fi{background:var(--bg3);border:1px solid var(--b2);border-radius:var(--rads);padding:9px 11px;font-size:13px;color:var(--t);width:100%;transition:border-color .15s}
.fi:focus{border-color:var(--b3)}
.fi::placeholder{color:var(--t3)}
.fta{background:var(--bg3);border:1px solid var(--b2);border-radius:var(--rads);padding:9px 11px;font-size:13px;color:var(--t);width:100%;resize:vertical;transition:border-color .15s;line-height:1.5}
.fta:focus{border-color:var(--b3)}
.fta::placeholder{color:var(--t3)}
.fsw{position:relative}
.fse{background:var(--bg3);border:1px solid var(--b2);border-radius:var(--rads);padding:9px 11px;font-size:13px;color:var(--t);width:100%;appearance:none;cursor:pointer}
.fsw::after{content:'▾';position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:10px;pointer-events:none}
.alcg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.alc{display:flex;align-items:center;gap:6px;padding:8px 9px;border-radius:var(--rads);border:1px solid var(--b2);background:var(--bg3);cursor:pointer;transition:all .15s}
.alc.act{border-color:var(--ab);background:var(--abg)}
.alc.act .alcl{color:var(--a)}
.alcl{font-size:12px;color:var(--t2)}
.imgr{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.iprev{width:42px;height:42px;border-radius:var(--radxs);border:1px solid var(--b2);background:var(--bg3);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--t3)}
.iprev img{width:100%;height:100%;object-fit:cover}

/* Drawer */
.dov{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0);pointer-events:none;transition:background .22s}
.dov.act{background:rgba(0,0,0,.72);pointer-events:all}
.drw{position:absolute;top:0;right:0;bottom:0;width:min(510px,96vw);background:var(--bg2);border-left:1px solid var(--b);transform:translateX(100%);transition:transform .28s cubic-bezier(.32,0,.67,0);display:flex;flex-direction:column}
.dov.act .drw{transform:translateX(0)}
.drhd{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--b);flex-shrink:0}
.drttl{font-size:15px;font-weight:500;color:var(--t)}
.drsub{font-size:11px;color:var(--t3);margin-top:2px}
.drclose{width:29px;height:29px;border-radius:var(--radxs);background:var(--bg3);border:1px solid var(--b2);color:var(--t2);font-size:16px;display:flex;align-items:center;justify-content:center}
.drbody{flex:1;overflow-y:auto;padding:18px}
.drfoot{padding:14px 18px;border-top:1px solid var(--b);display:flex;gap:8px;flex-shrink:0}
.btn-sv{flex:1;padding:11px;background:var(--a);color:#000;border-radius:var(--rads);font-size:14px;font-weight:600}
.btn-ca{padding:11px 15px;background:var(--bg3);border:1px solid var(--b2);color:var(--t2);border-radius:var(--rads);font-size:14px}
.btn-dng{padding:9px 13px;border-radius:var(--rads);font-size:12px;color:var(--rt);background:var(--rbg);border:1px solid var(--rb)}

/* Config */
.cfr{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--b)}
.cfr:last-child{border-bottom:none}
.cfl{flex:1;margin-right:14px}
.cfn{font-size:13px;font-weight:500;color:var(--t);margin-bottom:2px}
.cfd{font-size:12px;color:var(--t3);line-height:1.4}
.cfi{background:var(--bg3);border:1px solid var(--b2);border-radius:var(--rads);padding:7px 10px;font-size:13px;color:var(--t);width:200px;transition:border-color .15s}
.cfi:focus{border-color:var(--b3)}

/* Kanban */
.kboard{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:9px;padding:14px;overflow-x:auto;min-height:calc(100vh - 200px)}
.kcol{background:var(--bg2);border:1px solid var(--b);border-radius:var(--rad);display:flex;flex-direction:column;overflow:hidden}
.kchd{padding:11px 13px 9px;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.kcttl{font-size:13px;font-weight:500;color:var(--t);display:flex;align-items:center;gap:6px}
.kdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.kcnt{min-width:19px;height:19px;border-radius:var(--pill);padding:0 5px;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center}
.k1 .kdot{background:var(--a)} .k1 .kcnt{background:var(--abg);color:var(--a);border:1px solid var(--ab)}
.k2 .kdot{background:var(--mp)} .k2 .kcnt{background:var(--mpbg);color:var(--mp);border:1px solid var(--mpb)}
.k3 .kdot{background:var(--g)} .k3 .kcnt{background:var(--gbg);color:var(--gt);border:1px solid var(--gb)}
.k4 .kdot{background:var(--t3)} .k4 .kcnt{background:var(--bg4);color:var(--t3);border:1px solid var(--b2)}
.kcards{padding:9px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:7px}
.kcard{background:var(--bg3);border:1px solid var(--b);border-radius:var(--rads);overflow:hidden}
.kchdr{display:flex;align-items:center;justify-content:space-between;padding:9px 11px 7px;border-bottom:1px solid var(--b)}
.kmesa{font-size:14px;font-weight:600;color:var(--t)}
.ktime{font-size:11px;color:var(--t3)}
.kel{font-size:10px;font-weight:500;padding:2px 6px;border-radius:var(--pill)}
.ke1{background:var(--gbg);color:var(--gt)}
.ke2{background:var(--obg);color:var(--ot)}
.ke3{background:var(--rbg);color:var(--rt)}
.kcitems{padding:9px 11px}
.kci{display:flex;align-items:flex-start;gap:7px;padding:4px 0;border-bottom:1px solid var(--b)}
.kci:last-child{border-bottom:none}
.kqty{width:21px;height:21px;border-radius:4px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--t);flex-shrink:0;margin-top:1px}
.kn{font-size:12px;color:var(--t);line-height:1.3}
.knote{font-size:10px;color:var(--a);margin-top:1px;line-height:1.3}
.ksec{display:inline-flex;align-items:center;font-size:9px;font-weight:500;padding:1px 5px;border-radius:3px;margin-top:2px}
.ks-c{background:var(--obg);color:var(--ot)}
.ks-b{background:var(--mpbg);color:var(--mp)}
.kcfoo{display:flex;align-items:center;justify-content:space-between;padding:7px 11px;border-top:1px solid var(--b)}
.ktot{font-size:12px;font-weight:500;color:var(--a)}
.kpaid{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--gt)}
.kacts{padding:0 9px 9px;display:flex;gap:5px}
.kadv{flex:1;padding:7px;border-radius:var(--rads);font-size:12px;font-weight:500}
.ka1{background:var(--mpbg);border:1px solid var(--mpb);color:var(--mp)}
.ka2{background:var(--gbg);border:1px solid var(--gb);color:var(--gt)}
.ka3{background:var(--bg4);border:1px solid var(--b2);color:var(--t2)}
.kempty{text-align:center;padding:20px 10px;font-size:12px;color:var(--t3)}

/* QR */
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qcard{background:var(--bg2);border:1px solid var(--b);border-radius:var(--rad);padding:18px;text-align:center}
.qrwrap{background:#fff;border-radius:9px;padding:14px;display:inline-block;margin:12px 0}
.qurl{font-size:10px;color:var(--t3);background:var(--bg3);padding:4px 11px;border-radius:var(--pill);display:inline-block;margin-bottom:13px;border:1px solid var(--b)}
.btn-dl{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;background:var(--bg3);border:1px solid var(--b2);color:var(--t2);border-radius:var(--rads);font-size:13px;width:100%;transition:all .15s}
.btn-dl:hover{border-color:var(--b3);color:var(--t)}

/* Login */
.loginpage{min-height:calc(100vh - 36px);display:flex;align-items:center;justify-content:center;padding:24px}
.logincard{width:100%;max-width:360px;background:var(--bg2);border:1px solid var(--b);border-radius:18px;padding:30px 26px 34px}
.llogin{width:46px;height:46px;border-radius:11px;background:var(--a);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:19px;color:#000;margin:0 auto 18px}
.lttl{font-family:'Fraunces',serif;font-size:24px;font-weight:300;color:var(--t);text-align:center;margin-bottom:5px}
.lsub{font-size:13px;color:var(--t3);text-align:center;margin-bottom:26px}
.linp{width:100%;background:var(--bg3);border:1px solid var(--b2);border-radius:var(--rads);padding:10px 13px;font-size:14px;color:var(--t);margin-bottom:13px;transition:border-color .15s}
.linp:focus{border-color:var(--b3)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:20px}
.role{padding:10px 8px;border-radius:var(--rads);border:1px solid var(--b2);background:var(--bg3);text-align:center;transition:all .15s;cursor:pointer}
.role.act{border-color:var(--ab);background:var(--abg)}
.role.act .rl{color:var(--a)}
.ri{font-size:18px;margin-bottom:4px}
.rl{font-size:12px;font-weight:500;color:var(--t2)}
.rd{font-size:10px;color:var(--t3);margin-top:2px;line-height:1.3}
.btn-li{width:100%;padding:12px;background:var(--a);color:#000;border-radius:var(--rads);font-size:14px;font-weight:600}

/* Staff banner */
.sbanner{display:flex;align-items:center;gap:9px;padding:11px 14px;background:var(--blbg);border:1px solid var(--blb);border-radius:var(--rads);margin-bottom:14px;font-size:13px;color:var(--blt)}

/* Live dot */
.ldot{width:7px;height:7px;border-radius:50%;background:var(--gt);animation:plive 2s infinite}
@keyframes plive{0%,100%{box-shadow:0 0 0 0 rgba(94,175,133,.4)}50%{box-shadow:0 0 0 5px rgba(94,175,133,0)}}

/* Confirm */
.confov{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:22px}
.confov.act{display:flex}
.confcard{background:var(--bg2);border:1px solid var(--b);border-radius:var(--rad);padding:22px;max-width:330px;width:100%}
.confttl{font-size:15px;font-weight:500;color:var(--t);margin-bottom:8px}
.confd{font-size:13px;color:var(--t2);line-height:1.5;margin-bottom:18px}
.confacts{display:flex;gap:8px}

/* Toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);opacity:0;background:var(--bg4);border:1px solid var(--b2);border-radius:var(--pill);padding:9px 18px;font-size:13px;color:var(--t);white-space:nowrap;z-index:600;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .28s;box-shadow:var(--shad);pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.ok{color:var(--gt)}
.toast.err{color:var(--rt)}

/* Helpers */
.sep{font-size:10px;font-weight:600;color:var(--t3);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;display:block}
.empty{text-align:center;padding:40px 20px;color:var(--t3);font-size:14px}

@media(max-width:680px){
  .asidebar{display:none}
  .amain{height:auto}
  .kboard{grid-template-columns:repeat(4,minmax(175px,1fr))}
  .qgrid{grid-template-columns:1fr}
  .fg2{grid-template-columns:1fr}
  .alcg{grid-template-columns:1fr 1fr}
  .cfi{width:150px}
}

/* ══ METRICS ══ */
.mtr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.mtr-card{background:var(--bg3);border-radius:var(--rads);padding:14px 16px}
.mtr-label{font-size:11px;color:var(--t3);letter-spacing:.3px;margin-bottom:7px}
.mtr-val{font-size:24px;font-weight:600;color:var(--t);line-height:1}
.mtr-sub{font-size:11px;margin-top:5px}
.mtr-up{color:var(--gt)}.mtr-dn{color:var(--rt)}.mtr-neu{color:var(--t3)}
.bar-chart{display:flex;align-items:flex-end;gap:5px;height:110px;padding:0 2px}
.bar-col{display:flex;flex-direction:column;align-items:center;flex:1;gap:4px;height:100%}
.bar-fill{border-radius:3px 3px 0 0;width:100%;min-height:2px;margin-top:auto}
.bar-lbl{font-size:9px;color:var(--t3);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.bar-val{font-size:9px;color:var(--t2)}
.rank-list{display:flex;flex-direction:column}
.rank-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--b)}
.rank-item:last-child{border-bottom:none}
.rank-n{font-size:11px;color:var(--t3);width:16px;text-align:right;flex-shrink:0}
.rank-img{width:38px;height:38px;border-radius:var(--radxs);overflow:hidden;flex-shrink:0;background:var(--bg3)}

function showPage(id, btn) {
  document.querySelectorAll('.pg').forEach(p => p.classList.remove('act'));
  document.querySelectorAll('.db').forEach(b => b.classList.remove('act'));
  document.getElementById('pg-' + id).classList.add('act');
  if (btn) btn.classList.add('act');
  document.body.style.overflow = '';
  if (id === 'mb') renderMenu('mb');
  if (id === 'mp') renderMenu('mp');
  if (id === 'kb') renderKanban();
  if (id === 'sv') renderSurvey();
}

function renderMenu(k) {
  document.getElementById('root-' + k).innerHTML = menuHTML(k);
}

function filtProds(k) {
  const m = MS[k];
  let p = S.prods.filter(x => x.st !== 'hidden');
  if (m.q) {
    const q = m.q.toLowerCase();
    p = p.filter(x => x.nEs.toLowerCase().includes(q) || x.nEn.toLowerCase().includes(q) || x.dEs.toLowerCase().includes(q));
  }
  if (m.cat !== 'all') p = p.filter(x => x.cat === m.cat);
  if (m.als.length) p = p.filter(x => !m.als.some(a => x.al.includes(a)));
  return p;
}

function prodGridHTML(fps, k, m) {
  const L = m.lang;
  if (!fps.length) return `<div class="empty">Sin resultados para esta búsqueda</div>`;

  if (m.q || m.als.length) {
    return `<div class="cg"><div class="pgrid">${fps.map(p => pcardHTML(p, k, m)).join('')}</div></div>`;
  }

  const catL = {es:{Entradas:'Entradas',Principales:'Principales',Postres:'Postres',Bebidas:'Bebidas'},
                 en:{Entradas:'Starters',Principales:'Mains',Postres:'Desserts',Bebidas:'Drinks'}};
  const cats = [...new Set(fps.map(p => p.cat))];
  return cats.map(cat => `
    <div class="cg">
      <div class="cg-hd">${catL[L]?.[cat]||cat}<div class="cg-line"></div></div>
      <div class="pgrid">${fps.filter(p=>p.cat===cat).map(p=>pcardHTML(p,k,m)).join('')}</div>
    </div>`).join('');
}

function pcardHTML(p, k, m) {
  const L = m.lang;
  const name = L==='es' ? p.nEs : p.nEn;
  const desc = L==='es' ? p.dEs : p.dEn;
  const ci = m.cart.find(c => c.pid === p.id);
  const validImgs = p.imgs.filter(Boolean);
  return `
  <div class="pcard${p.st==='soldout'?' so':''}" onclick="MA('${k}','openProd',${p.id})" role="button">
    <div class="pcard-img">
      <img src="${p.imgs[0]}" alt="${name}" loading="lazy">
      ${p.st==='soldout' ? `<div class="p-so">${T('solab',L)}</div>` : ''}
      ${validImgs.length>1 ? `<div class="p-ph">📷${validImgs.length}</div>` : ''}
      ${S.cfg.showAllergens !== false ? `<div class="p-al">${p.al.slice(0,3).map(a=>{const al=ALD.find(x=>x.id===a);return al?`<div class="al-dot">${al.icon}</div>`:''}).join('')}</div>` : ''}
    </div>
    <div class="pbody">
      <div class="pname">${name}</div>
      <div class="pdesc">${desc}</div>
      <div class="pfoot">
        <span class="pprice">$${p.price.toLocaleString('es-AR')}</span>
        ${ci ? `<span class="pcb">×${ci.qty}</span>` : ''}
      </div>
    </div>
  </div>`;
}

    <button class="btn-ig" onclick="toast('${p.ig ? 'Abriendo el post...' : 'Abriendo Instagram...'}')">

        <span class="revttl">${T('revttl',L)}</span>

// ══════════════════════════════════════════
// MENU ACTION DISPATCHER
// ══════════════════════════════════════════
function MA(k, action, payload) {
  const m = MS[k];
  switch(action) {
    case 'lang':    m.lang = payload; break;
    case 'cat':     m.cat = payload; m.q = ''; break;
    case 'q':       m.q = payload; m.cat = 'all'; break;
    case 'sort':    m.sort = m.sort===payload ? null : payload; break;
    case 'openProd': {
      const p = S.prods.find(x => x.id===payload);
      if (p) { m.prod=p; m.carI=0; document.body.style.overflow='hidden'; }
      break;
    }
    case 'closeProd': m.prod=null; document.body.style.overflow=''; break;
    case 'car':     { const imgs=m.prod.imgs.filter(Boolean); m.carI=Math.max(0,Math.min(imgs.length-1,m.carI+payload)); break; }
    case 'carI':    m.carI=payload; break;
    case 'qty': {
      const ci=m.cart.find(c=>c.pid===m.prod.id);
      const cur=ci?ci.qty:1;
      const nv=Math.max(1,cur+payload);
      if(ci) ci.qty=nv;
      const qvEl=document.getElementById('qv-'+k);
      const qpEl=document.getElementById('qp-'+k);
      if(qvEl) qvEl.textContent=nv;
      if(qpEl&&m.prod) qpEl.textContent='$'+(m.prod.price*nv).toLocaleString('es-AR');
      return; // skip full re-render
    }
    case 'addCart': {
      if (!m.prod) return;
      const noteEl=document.getElementById('nt-'+k);
      const qvEl=document.getElementById('qv-'+k);
      const note=noteEl?noteEl.value:'';
      const qty=parseInt(qvEl?.textContent)||1;
      const ex=m.cart.find(c=>c.pid===m.prod.id);
      if(ex){ex.qty=qty;ex.note=note;}
      else m.cart.push({pid:m.prod.id,qty,note});
      m.prod=null; document.body.style.overflow='';
      toast(m.lang==='es'?'Agregado ✓ — revisá tu pedido':'Added ✓ — check your order','ok');
      renderMenu(k);
      setTimeout(()=>openStaticCart(k), 320); // open cart after modal closes
      return;
    }
    case 'openCart':  openStaticCart(k); return;
    case 'closeCart': closeStaticCart(); return;
    case 'cqty': {
      const {pid,d}=payload;
      const ci=m.cart.find(c=>c.pid===pid);
      if(ci) ci.qty=Math.max(1,ci.qty+d);
      break;
    }
    case 'cdel':    m.cart=m.cart.filter(c=>c.pid!==payload); break;
    case 'openFilt':  m.fsAls=[...m.als]; m.filtOpen=true; document.body.style.overflow='hidden'; break;
    case 'closeFilt': m.filtOpen=false; document.body.style.overflow=''; break;
    case 'fsAl':    m.fsAls=m.fsAls.includes(payload)?m.fsAls.filter(x=>x!==payload):[...m.fsAls,payload]; break;
    case 'applyFilt': m.als=[...m.fsAls]; m.filtOpen=false; document.body.style.overflow=''; break;
  }
  renderMenu(k);
}

// STATIC CART — lives outside the render loop
// ══════════════════════════════════════════
let _cartKey = 'mp';

function openStaticCart(k) {
  _cartKey = k;
  renderStaticCart();
  document.getElementById('static-cart').classList.add('act');
  document.body.style.overflow = 'hidden';
}

function closeStaticCart() {
  document.getElementById('static-cart').classList.remove('act');
  document.body.style.overflow = '';
}

function renderStaticCart() {
  const k = _cartKey;
  const m = MS[k];
  const L = m.lang;
  const total = m.cart.reduce((a,c) => { const p=S.prods.find(x=>x.id===c.pid); return a+(p?p.price*c.qty:0); }, 0);
  const count = m.cart.reduce((a,c) => a+c.qty, 0);

  document.getElementById('sc-title').textContent = L==='es' ? 'Tu pedido' : 'Your order';
  document.getElementById('sc-mesa').innerHTML = `Mesa <strong style="color:var(--a)">${m.mesa}</strong>`;

  const itemsEl = document.getElementById('sc-items');
  const footEl  = document.getElementById('sc-foot');

  if (!m.cart.length) {
    itemsEl.innerHTML = `<div class="cempty">${L==='es'?'Tu pedido está vacío':'Your order is empty'}</div>`;
    footEl.style.display = 'none';
    return;
  }

  itemsEl.innerHTML = m.cart.map(ci => {
    const p = S.prods.find(x=>x.id===ci.pid);
    if (!p) return '';
    const n = L==='es' ? p.nEs : p.nEn;
    return `<div class="ci">
      <div class="ci-img"><img src="${p.imgs[0]}" alt="${n}" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div>
      <div class="ci-info">
        <div class="ci-name">${n}</div>
        ${ci.note ? `<div class="ci-note">📝 ${ci.note}</div>` : ''}
        <div class="ci-bot">
          <span class="ci-price">$${(p.price*ci.qty).toLocaleString('es-AR')}</span>
          <div class="ciqty">
            <button class="ciqb" onclick="scQty(${ci.pid},-1)">−</button>
            <span class="ciqv">${ci.qty}</span>
            <button class="ciqb" onclick="scQty(${ci.pid},1)">+</button>
          </div>
        </div>
      </div>
      <button class="ci-del" onclick="scDel(${ci.pid})">×</button>
    </div>`;
  }).join('');

  footEl.style.display = 'block';
  footEl.innerHTML = `
    <div class="csrow"><span>${count} ítem${count!==1?'s':''}</span><span>$${total.toLocaleString('es-AR')}</span></div>
    <div class="ctrow"><span class="ctl">Total</span><span class="ctv">$${total.toLocaleString('es-AR')}</span></div>
    <div class="pay-opts">
      <button class="btn-co mp" onclick="doCheckout('${k}','mp')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
        ${L==='es'?'Pagar con Mercado Pago':'Pay with Mercado Pago'}
      </button>
      <div class="pay-sep"><span>${L==='es'?'o':'or'}</span></div>
      <button class="btn-co cash" onclick="doCheckout('${k}','cash')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/></svg>
        ${L==='es'?'Pagar en efectivo':'Pay with cash'}
      </button>
      <button class="btn-co later" onclick="doCheckout('${k}','later')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        ${L==='es'?'Prefiero pagar al terminar':'I\'ll pay at the end'}
      </button>
    </div>
    <div class="cterms">${L==='es'?'Tu pedido se envía a cocina en todos los casos':'Your order goes to the kitchen in all cases'}</div>`;
}

function scQty(pid, d) {
  const m = MS[_cartKey];
  const ci = m.cart.find(c=>c.pid===pid);
  if (ci) ci.qty = Math.max(1, ci.qty+d);
  renderStaticCart();
  renderMenu(_cartKey);
}

function scDel(pid) {
  const m = MS[_cartKey];
  m.cart = m.cart.filter(c=>c.pid!==pid);
  renderStaticCart();
  renderMenu(_cartKey);
}


function doCheckout(k, payMethod) {
  const m = MS[k];
  function mt(mins) { const d=new Date(Date.now()-mins*60000); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  const items = m.cart.map(c => { const p=S.prods.find(x=>x.id===c.pid); return {pid:c.pid,qty:c.qty,note:c.note,sector:p?p.sector:'cocina'}; });
  const total = m.cart.reduce((a,c)=>{ const p=S.prods.find(x=>x.id===c.pid); return a+(p?p.price*c.qty:0); },0);
  S.comandas.unshift({id:Date.now(), mesa:m.mesa, st:'nuevo', time:mt(0), items, total, pay:payMethod});
  m.cart=[]; closeStaticCart();
  const msgs = {
    mp:   m.lang==='es' ? '✓ Pedido enviado · Redirigiendo a Mercado Pago...' : '✓ Order sent · Redirecting to Mercado Pago...',
    cash: m.lang==='es' ? '✓ Pedido enviado · Pago en efectivo al retirar' : '✓ Order sent · Pay with cash on delivery',
    later:m.lang==='es' ? '✓ Pedido enviado · Pagás al finalizar' : '✓ Order sent · You\'ll pay at the end',
  };
  toast(msgs[payMethod] || '✓ Pedido enviado', 'ok');
  renderMenu(k);
}

// KANBAN
// ══════════════════════════════════════════
let kbSec = 'all';

function kbSector(sec, btn) {
  kbSec = sec;
  document.querySelectorAll('#pg-kb .db').forEach(b => b.classList.remove('act'));
  if (btn) btn.classList.add('act');
  renderKanban();
}

function renderKanban() {
  const cols = [
    {key:'nuevo',      label:'Nuevos',     cls:'k1'},
    {key:'preparando', label:'Preparando', cls:'k2'},
    {key:'listo',      label:'Listo',      cls:'k3'},
    {key:'entregado',  label:'Entregado',  cls:'k4'},
  ];
  const wrap = document.getElementById('kboard');
  if (!wrap) return;

  wrap.innerHTML = cols.map(col => {
    const cards = S.comandas.filter(c => c.st===col.key && kbVisible(c));
    return `<div class="kcol ${col.cls}">
      <div class="kchd">
        <span class="kcttl"><span class="kdot"></span>${col.label}</span>
        <span class="kcnt">${cards.length}</span>
      </div>
      <div class="kcards">
        ${cards.length ? cards.map(c => kCardHTML(c, col.key)).join('') : '<div class="kempty">Sin comandas</div>'}
      </div>
    </div>`;
  }).join('');
}

function kbVisible(c) {
  if (kbSec==='all') return true;
  return c.items.some(i => { const p=S.prods.find(x=>x.id===i.pid); return p&&p.sector===kbSec; });
}

function kbItemVis(item) {
  if (kbSec==='all') return true;
  const p = S.prods.find(x=>x.id===item.pid);
  return p && p.sector===kbSec;
}

function kbElapsed(timeStr, st) {
  if (st==='entregado') return '';
  const [h,m] = timeStr.split(':').map(Number);
  const now = new Date();
  const mins = Math.max(0,(now.getHours()-h)*60+(now.getMinutes()-m));
  const cls = mins<10?'ke1':mins<20?'ke2':'ke3';
  return `<span class="kel ${cls}">${mins}min</span>`;
}

function kCardHTML(c, st) {
  const vis = c.items.filter(kbItemVis);
  const advMap = {nuevo:'→ Preparando', preparando:'→ Listo', listo:'→ Entregado'};
  const advCls = {nuevo:'ka1', preparando:'ka2', listo:'ka3'};

  return `<div class="kcard">
    <div class="kchdr">
      <span class="kmesa">Mesa ${c.mesa}</span>
      <div style="display:flex;align-items:center;gap:5px">
        <span class="ktime">${c.time}</span>
        ${kbElapsed(c.time,st)}
      </div>
    </div>
    <div class="kcitems">
      ${vis.map(item => {
        const p = S.prods.find(x=>x.id===item.pid);
        return `<div class="kci">
          <div class="kqty">${item.qty}</div>
          <div>
            <div class="kn">${p?p.nEs:'?'}</div>
            ${item.note ? `<div class="knote">📝 ${item.note}</div>` : ''}
            <span class="ksec ${item.sector==='barra'?'ks-b':'ks-c'}">${item.sector==='barra'?'🍹 Barra':'🍳 Cocina'}</span>
          </div>
        </div>`;
      }).join('')}
      ${kbSec!=='all' && vis.length<c.items.length ? `<div style="font-size:10px;color:var(--t3);padding-top:4px">+${c.items.length-vis.length} ítem(s) otro sector</div>` : ''}
    </div>
    <div class="kcfoo">
      <div>
        <span class="ktot">$${c.total.toLocaleString('es-AR')}</span>
        ${c.pay ? (() => {
          const cfg = {
            mp:    {cls:'kpay-mp',    icon:'💳', lbl:'Mercado Pago'},
            cash:  {cls:'kpay-cash',  icon:'💵', lbl:'Efectivo'},
            later: {cls:'kpay-later', icon:'🕐', lbl:'Paga al terminar'},
          }[c.pay] || {};
          return `<div><span class="kpay ${cfg.cls}">${cfg.icon} ${cfg.lbl}</span></div>`;
        })() : `<span class="kpaid"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>Pago confirmado</span>`}
      </div>
      ${c.pay === 'later' ? `<span style="font-size:10px;color:var(--rt);font-weight:500">⚠ Pendiente de pago</span>` :
        c.pay === 'cash'  ? `<span style="font-size:10px;color:var(--gt)">✓ Pago al retirar</span>` :
        `<span class="kpaid"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>Pago confirmado</span>`}
    </div>
    ${st!=='entregado' ? `<div class="kacts">
      <button class="kadv ${advCls[st]}" onclick="kbAdvance(${c.id})">${advMap[st]}</button>
    </div>` : ''}
  </div>`;
}

function kbAdvance(id) {
  const c = S.comandas.find(x=>x.id===id);
  if (!c || c.st==='entregado') return;
  const nxt = {nuevo:'preparando', preparando:'listo', listo:'entregado'};
  c.st = nxt[c.st];
  renderKanban();
  toast(`Mesa ${c.mesa} → ${c.st.charAt(0).toUpperCase()+c.st.slice(1)}`,'ok');
}

let editingId = null;
let FD = {};

function openDrw(id) {
  editingId = id;
  const p = id ? S.prods.find(x=>x.id===id) : null;
  FD = p
    ? {...p, imgs:[...p.imgs], al:[...p.al]}
    : {cat:S.cats[0]?.id||'', sector:'cocina', st:'active', nEs:'', nEn:'', dEs:'', dEn:'', price:'', al:[], imgs:['','',''], ig:'', revs:[]};
  document.getElementById('dr-ttl').textContent = id ? 'Editar producto' : 'Nuevo producto';
  document.getElementById('dr-sub').textContent = id ? `ID #${id} · Los cambios se ven en el menú al instante` : 'Aparecerá en el menú al guardar';
  document.getElementById('dr-body').innerHTML = drwFormHTML();
  document.getElementById('dov').classList.add('act');
  document.body.style.overflow = 'hidden';
}

function closeDov(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('dov').classList.remove('act');
  document.body.style.overflow = '';
}

function drwFormHTML() {
  const p = FD;
  const catOpts = S.cats.map(c=>`<option value="${c.id}" ${p.cat===c.id?'selected':''}>${c.label}</option>`).join('');
  return `<div class="fg" style="gap:16px">

    <div style="background:var(--bg3);border:1px solid var(--b);border-radius:var(--rads);padding:13px">
      <div class="sep">Nombre</div>
      <div class="fr" style="margin-bottom:10px"><label class="fl">🇦🇷 Español</label><input class="fi" id="f-nEs" value="${p.nEs}" placeholder="Nombre del plato" oninput="FD.nEs=this.value"></div>
      <div class="fr"><label class="fl">🇺🇸 English</label><input class="fi" id="f-nEn" value="${p.nEn}" placeholder="Dish name" oninput="FD.nEn=this.value"></div>
    </div>

    <div style="background:var(--bg3);border:1px solid var(--b);border-radius:var(--rads);padding:13px">
      <div class="sep">Descripción</div>
      <div class="fr" style="margin-bottom:10px"><label class="fl">🇦🇷 Español</label><textarea class="fta" rows="3" placeholder="Descripción..." oninput="FD.dEs=this.value">${p.dEs}</textarea></div>
      <div class="fr"><label class="fl">🇺🇸 English</label><textarea class="fta" rows="3" placeholder="Description..." oninput="FD.dEn=this.value">${p.dEn}</textarea></div>
    </div>

    <div class="fg fg2" style="gap:10px">
      <div class="fr"><label class="fl">Precio ($)</label><input class="fi" type="number" value="${p.price}" placeholder="0" oninput="FD.price=Number(this.value)"></div>
      <div class="fr"><label class="fl">Estado</label><div class="fsw"><select class="fse" onchange="FD.st=this.value"><option value="active" ${p.st==='active'?'selected':''}>Activo</option><option value="soldout" ${p.st==='soldout'?'selected':''}>Agotado</option><option value="hidden" ${p.st==='hidden'?'selected':''}>Oculto</option></select></div></div>
      <div class="fr"><label class="fl">Categoría</label><div class="fsw"><select class="fse" onchange="FD.cat=this.value">${catOpts}</select></div></div>
      <div class="fr"><label class="fl">Sector de cocina</label><div class="fsw"><select class="fse" onchange="FD.sector=this.value"><option value="cocina" ${p.sector==='cocina'?'selected':''}>🍳 Cocina</option><option value="barra" ${p.sector==='barra'?'selected':''}>🍹 Barra</option></select></div></div>
    </div>

    <div class="fr">
      <label class="fl">Fotos (hasta 3 URLs)</label>
      ${[0,1,2].map(i=>`<div class="imgr">
        <div class="iprev" id="ip${i}">${p.imgs[i]?`<img src="${p.imgs[i]}" alt="" onerror="this.parentElement.innerHTML='?'" style="width:100%;height:100%;object-fit:cover">`:''}</div>
        <input class="fi" style="flex:1" value="${p.imgs[i]||''}" placeholder="https://... ${i===0?'(requerida)':''}" oninput="updImg(${i},this.value)">
      </div>`).join('')}
      <div class="fh">Se muestran en carrusel en el menú. La primera es obligatoria.</div>
    </div>

    <div class="fr">
      <label class="fl">Alérgenos presentes</label>
      <div class="alcg">
        ${ALD.map(a=>`<div class="alc${p.al.includes(a.id)?' act':''}" id="alc-${a.id}" onclick="tglAl('${a.id}')">
          <span style="font-size:13px">${a.icon}</span><span class="alcl">${a.es}</span>
        </div>`).join('')}
      </div>
    </div>

    <div class="fr">
      <label class="fl">Link de Instagram del plato <span style="color:var(--t3)">(opcional)</span></label>
      <input class="fi" value="${p.ig||''}" placeholder="https://instagram.com/p/..." oninput="FD.ig=this.value">
      <div class="fh">Si tiene post propio, el botón de IG abre ese post directamente</div>
    </div>
  </div>`;
}

function updImg(i, url) {
  FD.imgs[i] = url;
  const el = document.getElementById('ip'+i);
  if (!el) return;
  el.innerHTML = url ? `<img src="${url}" alt="" onerror="this.parentElement.innerHTML='?'" style="width:100%;height:100%;object-fit:cover">` : '';
}

function tglAl(id) {
  const i = FD.al.indexOf(id);
  if (i>=0) FD.al.splice(i,1); else FD.al.push(id);
  const el = document.getElementById('alc-'+id);
  if (el) el.classList.toggle('act', FD.al.includes(id));
  const lbl = el?.querySelector('.alcl');
  if (lbl) lbl.style.color = FD.al.includes(id) ? 'var(--a)' : '';
}

function saveProd() {
  if (!FD.nEs.trim()) { toast('El nombre en español es requerido','err'); return; }
  if (!FD.price||FD.price<=0) { toast('El precio es requerido','err'); return; }
  if (!FD.imgs[0]) { toast('Al menos una foto es requerida','err'); return; }

  if (editingId) {
    const i = S.prods.findIndex(x=>x.id===editingId);
    if (i>=0) S.prods[i] = {...S.prods[i], ...FD};
  } else {
    S.prods.push({...FD, id:Date.now(), revs:[]});
  }

  closeDov();
  renderAProds(document.getElementById('admin-main'));
  renderMenu('mb'); renderMenu('mp');
  toast(editingId ? `✓ ${FD.nEs} actualizado` : `✓ ${FD.nEs} creado`,'ok');
}

// ══════════════════════════════════════════
function openConf(id) {
  const p = S.prods.find(x=>x.id===id);
  if (!p) return;
  document.getElementById('conf-ttl').textContent = `¿Eliminar "${p.nEs}"?`;
  document.getElementById('conf-d').textContent = 'Esta acción no se puede deshacer. El plato desaparece del menú al instante.';
  document.getElementById('conf-ok').onclick = () => {
    S.prods = S.prods.filter(x=>x.id!==id);
    closeConf();
    renderAProds(document.getElementById('admin-main'));
    renderMenu('mb'); renderMenu('mp');
    toast(`${p.nEs} eliminado`);
  };
  document.getElementById('confov').classList.add('act');
}
function closeConf() { document.getElementById('confov').classList.remove('act'); }

function renderACats(main) {
  main.innerHTML = `
  <div class="atbar">
    <div><div class="attl">Categorías</div><div class="atsub">Organizá las secciones del menú</div></div>
    <div class="atright"><button class="btn-pri" onclick="addCat()">+ Nueva categoría</button></div>
  </div>
  <div class="apbody">
    <div class="acard acbody">
      <div style="font-size:12px;color:var(--t3);margin-bottom:14px">Los cambios se reflejan en el menú del cliente al instante</div>
      ${S.cats.map(c => {
        const cnt = S.prods.filter(p=>p.cat===c.id).length;
        return `<div style="display:flex;align-items:center;gap:11px;background:var(--bg3);border:1px solid var(--b);border-radius:var(--rads);padding:11px 13px;margin-bottom:7px">
          <span style="color:var(--t3);font-size:16px;cursor:grab">⠿</span>
          <div style="flex:1">
            <div style="font-size:14px;font-weight:500;color:var(--t)">${c.label}</div>
            <div style="font-size:11px;color:var(--t3)">${cnt} producto${cnt!==1?'s':''}</div>
          </div>
          <label class="tog" title="${c.vis?'Ocultar':'Mostrar'}"><input type="checkbox" ${c.vis?'checked':''} onchange="tglCat('${c.id}',this.checked)"><div class="togtr"></div><div class="togkn"></div></label>
          <button class="ib" onclick="renameCat('${c.id}')" title="Renombrar">✏️</button>
          ${cnt===0 ? `<button class="ib del" onclick="delCat('${c.id}')" title="Eliminar">🗑️</button>` : ''}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function tglCat(id, v) {
  const c = S.cats.find(x=>x.id===id);
  if (c) { c.vis=v; toast(v ? `${c.label} visible en el menú` : `${c.label} oculta del menú`); }
}

function renameCat(id) {
  const c = S.cats.find(x=>x.id===id);
  if (!c) return;
  const n = prompt('Nuevo nombre para la categoría:', c.label);
  if (n?.trim()) {
    c.label = n.trim();
    renderACats(document.getElementById('admin-main'));
    renderMenu('mb'); renderMenu('mp');
    toast(`Renombrada a "${c.label}"`,'ok');
  }
}

function delCat(id) {
  S.cats = S.cats.filter(x=>x.id!==id);
  renderACats(document.getElementById('admin-main'));
  toast('Categoría eliminada');
}

function addCat() {
  const n = prompt('Nombre de la nueva categoría:');
  if (n?.trim()) {
    S.cats.push({id:n.trim(), label:n.trim(), vis:true});
    renderACats(document.getElementById('admin-main'));
    toast(`"${n.trim()}" creada`,'ok');
  }
}

function applyBrandColor(hex) {
  if (!hex || !/^#[0-9A-Fa-f]{6}$/.test(hex)) return;
  // Derive transparent variants from hex
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const root = document.documentElement;
  root.style.setProperty('--a',  hex);
  root.style.setProperty('--a2', lighten(r,g,b,20));
  root.style.setProperty('--abg',`rgba(${r},${g},${b},.08)`);
  root.style.setProperty('--ab', `rgba(${r},${g},${b},.28)`);
}

function lighten(r,g,b,pct) {
  const t = Math.round(pct*2.55);
  return `rgb(${Math.min(255,r+t)},${Math.min(255,g+t)},${Math.min(255,b+t)})`;
}

  <div class="sv-step-sub">Contanos tu experiencia general:<br>ambiente, espacio, comodidad</div>

  <div class="sv-stars" id="sv-stars-1">
    ${[1,2,3,4,5].map(n => `<span class="${SV.placeRating>=n?'lit':''}" onclick="svSetStar(1,${n})">${SV.placeRating>=n?'★':'☆'}</span>`).join('')}
  </div>
  <div class="sv-rating-lbl">${SV.placeRating ? RATING_LABELS[SV.placeRating] : ''}</div>

  ${showGoogle ? `
  <div style="background:var(--bg3);border:1px solid var(--b2);border-radius:var(--rad);padding:16px;margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <div style="width:38px;height:38px;border-radius:50%;background:#4285F4;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
      </div>
      <div>
        <div style="font-size:14px;font-weight:500;color:var(--t)">¡Tu experiencia fue excelente!</div>
        <div style="font-size:12px;color:var(--t3);margin-top:2px">Ayudá a otros compartiendo tu opinión en Google</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:4px;margin-bottom:12px">
      ${[1,2,3,4,5].map(()=>`<span style="color:#FBBC04;font-size:15px">★</span>`).join('')}
      <span style="font-size:12px;color:var(--t3);margin-left:4px">Tu calificación en Google Maps</span>
    </div>
    <button class="btn-goog" onclick="svGoogleReview()" style="margin-bottom:0">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 13.5a9 9 0 1 1-9-9h4.5"/><polyline points="16 2 21 2 21 7"/></svg>
      Dejar reseña en Google Maps
    </button>
  </div>` : ''}

  <label class="sv-label">Comentario <span style="color:var(--t3)">(opcional)</span></label>
  <textarea class="sv-ta" rows="3" placeholder="¿Qué te pareció el lugar?" oninput="SV.placeText=this.value">${SV.placeText}</textarea>

  <button class="sv-next" ${!SV.placeRating ? 'disabled' : ''} onclick="svNext()">
    Siguiente →
  </button>`;
}

// ── Paso 2: La comida ────────────────────────────────────────
function svStep2() {
  const q = SV.dishSearch.toLowerCase();
  const results = !SV.dish && q.length >= 1
    ? S.prods.filter(p => p.nEs.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q)).slice(0,5)
    : [];

  const searchBlock = `
  <div class="sv-search-wrap">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input class="sv-search" id="sv-dish-inp" value="${SV.dishSearch}"
      placeholder="Buscar plato..." oninput="SV.dishSearch=this.value;svDraw()">
  </div>
  ${results.length ? `<div class="sv-results">
    ${results.map(p=>`
    <div class="sv-dish-opt" onclick="svSelectDish('${p.id}')">
      <div class="sv-dish-img"><img src="${p.imgs[0]}" alt="" loading="lazy"></div>
      <div>
        <div class="sv-dish-name">${p.nEs}</div>
        <div class="sv-dish-cat">${p.cat} · $${p.price.toLocaleString('es-AR')}</div>
      </div>
    </div>`).join('')}
  </div>` : q.length>=1 ? `<div style="font-size:13px;color:var(--t3);padding:8px 0 14px">Sin resultados para "${SV.dishSearch}"</div>` : ''}`;

  const selectedBlock = `
  <div class="sv-sel-dish">
    <div class="sv-sel-img"><img src="${SV.dish?.imgs[0]}" alt=""></div>
    <div style="flex:1">
      <div class="sv-sel-name">${SV.dish?.nEs}</div>
      <div class="sv-sel-check">✓ Seleccionado</div>
    </div>
    <span class="sv-sel-x" onclick="SV.dish=null;SV.dishRating=0;SV.dishSearch='';svDraw()">×</span>
  </div>

  <div style="margin-bottom:6px">
    <label class="sv-label">¿Cómo calificás el plato?</label>
  </div>
  <div class="sv-stars">
    ${[1,2,3,4,5].map(n=>`<span class="${SV.dishRating>=n?'lit':''}" onclick="svSetStar(2,${n})">${SV.dishRating>=n?'★':'☆'}</span>`).join('')}
  </div>
  <div class="sv-rating-lbl">${SV.dishRating ? RATING_LABELS[SV.dishRating] : 'Tocá las estrellas para calificar'}</div>

  <label class="sv-label">Comentario <span style="color:var(--t3)">(opcional)</span></label>
  <textarea class="sv-ta" id="sv-dish-ta" rows="3"
    placeholder="Presentación, sabor, temperatura..."
    oninput="SV.dishText=this.value">${SV.dishText}</textarea>`;

  return `
  <div class="sv-step-icon">🍽️</div>
  <div class="sv-step-title">¿Qué comiste?</div>
  <div class="sv-step-sub">Buscá tu plato y contanos<br>cómo estuvo</div>

  ${SV.dish ? selectedBlock : searchBlock}

  <div class="sv-nav">
    <button class="sv-back" onclick="svBack()">← Atrás</button>
    <button class="sv-next" onclick="svNext()">Siguiente →</button>
  </div>`;
}

// ── Paso 3: Atención y propina ───────────────────────────────
function svStep3() {
  const hasTip = SV.tipAmount > 0;
  return `
  <div class="sv-step-icon">👨‍🍳</div>
  <div class="sv-step-title">¿Cómo fue la atención?</div>
  <div class="sv-step-sub">Calificá el servicio y, si querés,<br>dejá propina digital</div>

  <div class="sv-stars">
    ${[1,2,3,4,5].map(n => `<span class="${SV.serviceRating>=n?'lit':''}" onclick="svSetStar(3,${n})">${SV.serviceRating>=n?'★':'☆'}</span>`).join('')}
  </div>
  <div class="sv-rating-lbl">${SV.serviceRating ? RATING_LABELS[SV.serviceRating] : ''}</div>

  <label class="sv-label" style="margin-bottom:10px">¿Quién te atendió?</label>
  <div class="sv-waiters">
    ${WAITERS.map(w => `
    <div class="sv-waiter-btn${SV.waiter===w.id?' act':''}" onclick="SV.waiter='${w.id}';svDraw()">
      <div class="sv-wav">${w.av}</div>
      <div>
        <div class="sv-wname">${w.name}</div>
        <div class="sv-wrole">${w.role}</div>
      </div>
      <div class="sv-wcheck">✓</div>
    </div>`).join('')}
  </div>

  <label class="sv-label">Propina <span style="color:var(--t3)">(opcional)</span></label>
  <div class="tip-grid">
    ${[500,1000,2000].map(a => `
    <button class="tip-btn${SV.tipPreset===a?' act':''}" onclick="svSetTip(${a})">
      $${a.toLocaleString('es-AR')}
    </button>`).join('')}
    <button class="tip-btn${SV.tipPreset===0?' act':''}" onclick="svSetTip(0)">Omitir</button>
  </div>
  ${SV.tipPreset !== 0 && SV.tipPreset !== null ? `
  <input type="number" class="tip-custom" placeholder="O escribí otro monto..."
    value="${SV.tipPreset&&![500,1000,2000].includes(SV.tipPreset)?SV.tipPreset:''}"
    oninput="SV.tipAmount=Number(this.value)||0;SV.tipPreset=SV.tipAmount;svDraw()">` : ''}

  ${hasTip ? `
  <button class="btn-mp-tip" onclick="svPayTip()">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
    Pagar propina $${SV.tipAmount.toLocaleString('es-AR')} con Mercado Pago
  </button>
  <div style="font-size:11px;color:var(--t3);text-align:center;margin-bottom:12px">
    ${SV.waiter ? `La propina se acredita a ${WAITERS.find(w=>w.id===SV.waiter)?.name || 'tu mozo/a'}` : 'Asignada al equipo de servicio'}
  </div>` : ''}

  <div class="sv-nav">
    <button class="sv-back" onclick="svBack()">← Atrás</button>
    <button class="sv-next" onclick="svFinish()">Finalizar ✓</button>
  </div>`;
}

// ── Pantalla final ───────────────────────────────────────────
function svDone() {
  const excellent = SV.dishRating >= 4 && SV.dish;
  const waiterObj = SV.waiter ? WAITERS.find(w => w.id === SV.waiter) : null;
  return `
  <div class="sv-done">
    <div class="sv-done-icon">🙏</div>
    <div class="sv-done-title">¡Gracias!</div>
    <div class="sv-done-sub">
      Tu opinión nos ayuda a mejorar cada día.
      ${SV.tipAmount > 0 && waiterObj ? `<br><strong style="color:var(--gt)">Propina de $${SV.tipAmount.toLocaleString('es-AR')} acreditada a ${waiterObj.name}</strong>` : ''}
      <br><br>¡Esperamos verte pronto en ${S.cfg.name}!
    </div>

    ${excellent ? `
    <div class="sv-dish-card" onclick="svGoToMenu()">
      <div class="sv-dish-card-img"><img src="${SV.dish.imgs[0]}" alt=""></div>
      <div>
        <div style="font-size:10px;color:var(--a);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px">¡Te encantó!</div>
        <div class="sv-dish-card-name">${SV.dish.nEs}</div>
        <div class="sv-dish-card-stars">${'★'.repeat(SV.dishRating)}</div>
        <div class="sv-dish-card-cta">Ver el plato en el menú →</div>
      </div>
    </div>` : ''}

    <button class="btn-menu-link" onclick="svGoToMenu()">
      Ver el menú completo de ${S.cfg.name}
    </button>
  </div>`;
}

// ── Helpers de interacción ───────────────────────────────────
function svSetStar(step, n) {
  if (step === 1) SV.placeRating   = SV.placeRating === n ? 0 : n;
  if (step === 2) SV.dishRating    = SV.dishRating  === n ? 0 : n;
  if (step === 3) SV.serviceRating = SV.serviceRating=== n ? 0 : n;
  svDraw();
}

function svSelectDish(id) {
  SV.dish = S.prods.find(p => p.id === Number(id) || p.id === id) || null;
  SV.dishSearch = SV.dish ? SV.dish.nEs : '';
  SV.dishRating = 0;
  SV.dishText = '';
  svDraw();
}

function svSetTip(amount) {
  SV.tipPreset = amount;
  SV.tipAmount = amount;
  if (amount === 0) {
    svFinish(); // Omitir → cierra directo con agradecimiento
  } else {
    svDraw();
  }
}

function svPayTip() {
  toast(`Redirigiendo a Mercado Pago · $${SV.tipAmount.toLocaleString('es-AR')}`, 'ok');
}

function svGoogleReview() {
  toast('Abriendo Google Reviews...', 'ok');
}

function svNext() {
  if (SV.step < 3) { SV.step++; svDraw(); }
}

function svBack() {
  if (SV.step > 1) { SV.step--; svDraw(); }
}

function svFinish() {
  // Guardar reseña del plato si fue 4-5★
  if (SV.dish && SV.dishRating >= 4) {
    const prod = S.prods.find(p => p.id === SV.dish.id);
    if (prod) {
      prod.revs.unshift({
        u: 'Comensal',
        r: SV.dishRating,
        t: SV.dishText || RATING_LABELS[SV.dishRating],
        d: 'Hoy',
      });
    }
  }
  // Registrar propina en el waiter
  if (SV.tipAmount > 0 && SV.waiter) {
    if (!S.tips) S.tips = {};
    if (!S.tips[SV.waiter]) S.tips[SV.waiter] = 0;
    S.tips[SV.waiter] += SV.tipAmount;
  }
  SV.step = 4;
  svDraw();
}

function svGoToMenu() {
  showPage('mp', document.querySelector('.db:nth-child(3)'));
  // If they loved a dish, open it in the modal
  if (SV.dish && SV.dishRating >= 4) {
    setTimeout(() => MA('mp', 'openProd', SV.dish.id), 400);
  }
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
applyBrandColor(S.cfg.primaryColor);
renderMenu('mb');
</script>
<!-- ══════ PAGE: SURVEY ══════ -->
<div class="pg" id="pg-sv"></div>

</body>
</html>
